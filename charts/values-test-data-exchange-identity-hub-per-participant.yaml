###############################################################
#
# Data-exchange profile: Identity Hub with PER-PARTICIPANT topology (2 participants).
#
# provider + consumer1, EACH on its OWN Identity Hub behind its OWN ingress host,
# instead of one shared multi-tenant IH (values-test-data-exchange-identity-hub.yaml).
# This validates the cross-IdentityHub DCP flow — the smoke test runs a
# provider<->consumer1 transfer with each holder on a DISTINCT IdentityHub — at a
# footprint that fits a single kind node.
#
#   * provider  → bundle Identity Hub, hosted at ih-provider.tx.test
#   * consumer1 → identity-hub-consumer1   (ih-consumer1.tx.test)
#   * Issuer Service → issuer-service.tx.test (shared trust anchor; both trust it)
#
# Only TWO IdentityHub JVMs. The operator + consumer2 participants of the full
# topology are intentionally omitted: the transfer exercises only provider<->consumer1,
# so extra IdentityHubs add resource cost but no functional coverage. (A 4-IH variant
# over-contends a single node — during the startup stampede the provider data-backend
# loses the CPU race against the IdentityHub JVMs, fails its liveness probe, and
# crashloops, stalling the post-install test-data hook.) The provider REUSES the
# bundle IdentityHub (alias `identity-hub`) as its own per-participant IH — the bundle
# IH must stay enabled to satisfy the wallet validator anyway — so there is no
# separate "operator" IdentityHub.
#
# DIDs keep the BPN path segment (did:web:<host>:<BPN>) so DID-document resolution
# reuses the exact, proven code path of the shared profile — only the host differs.
#
# Self-contained (installable with a single topology `-f`; the connector/BDRS blocks
# are intentionally not factored into a shared base — every connector points at a
# different per-participant host, which plain values files cannot derive).
#
# Usage:
#   bash hack/helm-dependencies.bash          # repackages nested subcharts
#   helm install umbrella charts/umbrella \
#     -f charts/values-test-data-exchange-identity-hub-per-participant.yaml \
#     -f charts/values-test-data-exchange-identity-hub-local-0.17.0.yaml \
#     --namespace umbrella --create-namespace --timeout 25m
#   # smoke test (provider on its own IH host):
#   INGRESS_IP=127.0.0.1 PROVIDER_DID=did:web:ih-provider.tx.test:BPNL00000003AYRE \
#     ./hack/dcp-data-transfer-smoke.sh
###############################################################

wallet:
  mode: identityHub
  operatorBpn: "BPNL00000003CRHK"
  # Slim the dataspace to the two transfer parties. operator + consumer2 are
  # REMOVED (Helm null-deletes the key) from the umbrella default participant set,
  # so the derived ConfigMap + seeding Job provision only provider + consumer1.
  participants:
    operator: null
    consumer2: null
  identityHub:
    topology: perParticipant
    perParticipant:
      # Participant slug -> ingress host of THAT participant's own Identity Hub.
      hosts:
        provider:  "ih-provider.tx.test"
        consumer1: "ih-consumer1.tx.test"
      # Participant slug -> in-cluster IdentityHub name (the Helm dep alias).
      # provider reuses the bundle IH (alias `identity-hub`); consumer1 gets a
      # dedicated one. Drives the Service DNS (<release>-<base>) + pod-label
      # selector (app.kubernetes.io/name=<base>) the seeding Job uses.
      serviceBase:
        provider:  "identity-hub"
        consumer1: "identity-hub-consumer1"

# -----------------------------------------------------------------------------
# Provider Identity Hub (the bundle IH) + shared Issuer Service.
# The bundle IdentityHub IS the provider's wallet; its ingress is ih-provider.tx.test
# so the provider DID is did:web:ih-provider.tx.test:<BPN>. It must stay enabled to
# satisfy the wallet validator (which gates on `identity-hub`/`identity-hub-postgres`).
# -----------------------------------------------------------------------------
identity-and-trust-bundle:
  enabled: true
  ssi-dim-wallet-stub:
    enabled: false
  identity-hub:
    enabled: true
    identityhub:
      ingresses:
        - enabled: true
          hostname: "ih-provider.tx.test"
          endpoints: [credentials, did, sts]
          className: "nginx"
          tls:
            enabled: false
        - enabled: true
          hostname: "ih-provider-admin.tx.test"
          endpoints: [identity, accounts]
          className: "nginx"
          tls:
            enabled: false
  issuer-service:
    enabled: true
    # Widen the issuer probes: the chart default liveness (90s + 6×15s ≈ 180s) is too
    # tight on a contended node — the issuer gets SIGTERM-killed mid-startup and flaps
    # Ready<->NotReady during the IdentityHub seed's credential loop, so the seed's
    # `kubectl wait` fails / only some credentials issue. (Same rationale as
    # values-persistent-local.yaml; harmless on an uncontended node.)
    issuerservice:
      livenessProbe:
        initialDelaySeconds: 120
        periodSeconds: 15
        failureThreshold: 40
      readinessProbe:
        initialDelaySeconds: 30
        periodSeconds: 15
        failureThreshold: 40
    # D25: absolute, cluster-reachable status-list URL embedded into every issued
    # VC. A non-absolute value breaks downstream VP verifiers (BDRS revocation-list
    # download → "URI is not absolute" → 400).
    statuslist:
      callback:
        address: "http://issuer-service.tx.test/statuslist"

# -----------------------------------------------------------------------------
# consumer1's dedicated Identity Hub (umbrella-level aliased dep). Lean-tuned
# (768Mi limit, heap capped) and exposes its own did:web host.
# -----------------------------------------------------------------------------
identity-hub-consumer1:
  enabled: true
  install:
    postgresql: false
    vault: false
  identityhub:
    livenessProbe:
      initialDelaySeconds: 90
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 90
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 6
    resources:
      requests:
        cpu: 150m
        memory: 320Mi
      limits:
        cpu: 1
        memory: 768Mi
    # Cap heap to ~50% of the 768Mi limit.
    env:
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=50.0"
    didweb:
      https: false
    ingresses:
      - enabled: true
        hostname: "ih-consumer1.tx.test"
        endpoints: [credentials, did, sts]
        className: "nginx"
        tls:
          enabled: false
      # Admin ingress: exposes the Identity API (/api/identity) so the admin panel
      # can read consumer1's ParticipantContexts/credentials and its health probe
      # works — mirrors the provider's ih-provider-admin host. Without it the panel's
      # consumer1 IdentityHub check 404s.
      - enabled: true
        hostname: "ih-consumer1-admin.tx.test"
        endpoints: [identity, accounts]
        className: "nginx"
        tls:
          enabled: false

# The remaining per-participant IH aliases are unused in the 2-participant topology.
identity-hub-provider:
  enabled: false
identity-hub-consumer2:
  enabled: false

# -----------------------------------------------------------------------------
# EDC connectors → each participant's OWN Identity Hub (DCP schema, 0.13.0-rc2).
# Per-host DIDs / STS / credential-service URLs; trustedIssuers stays the single
# shared IssuerService DID (it SIGNS the VCs; the per-host IH only HOSTS them).
# -----------------------------------------------------------------------------
dataconsumerOne:
  enabled: true
  wallet:
    mode: identityHub
    # The provider's tx-data-provider instance runs THE single seeding Job; disable
    # the redundant per-consumer Job.
    identityHubSeed:
      enabled: false
  dataspace-connector-bundle:
    tractusx-connector:
      dcp:
        trustedIssuers:
          - did:web:issuer-service.tx.test:BPNL00000003CRHK
        sts:
          div:
            url: ""
          oauth:
            token_url: http://ih-consumer1.tx.test/api/sts/token
            client:
              id: did:web:ih-consumer1.tx.test:BPNL00000003AZQP
              secret_alias: edc-wallet-secret
      participant:
        id: did:web:ih-consumer1.tx.test:BPNL00000003AZQP
        bpnl: BPNL00000003AZQP
        # plain participantContextId (EDC 0.17.0 / IH #937)
        contextId: "consumer-bpnl00000003azqp"
      controlplane:
        env:
          TX_EDC_IAM_DCP_CREDENTIALSERVICE_URL: http://ih-consumer1.tx.test/api/credentials/v1/participants/consumer-bpnl00000003azqp
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-consumer1.tx.test/api/credentials/v1/participants/consumer-bpnl00000003azqp
        bdrs:
          server:
            url: http://bdrs-server:8082/api/directory
      dataplane:
        env:
          TX_EDC_IAM_DCP_CREDENTIALSERVICE_URL: http://ih-consumer1.tx.test/api/credentials/v1/participants/consumer-bpnl00000003azqp
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-consumer1.tx.test/api/credentials/v1/participants/consumer-bpnl00000003azqp

tx-data-provider:
  enabled: true
  wallet:
    mode: identityHub
    # THE single Identity-Hub seeding Job. Its default IdentityHub is the bundle
    # `identity-hub` (= the provider's IH); the per-participant loop then reaches
    # consumer1's dedicated IH via the serviceBase map above.
    identityHubSeed:
      enabled: true
  dataspace-connector-bundle:
    tractusx-connector:
      dcp:
        trustedIssuers:
          - did:web:issuer-service.tx.test:BPNL00000003CRHK
        sts:
          div:
            url: ""
          oauth:
            token_url: http://ih-provider.tx.test/api/sts/token
            client:
              id: did:web:ih-provider.tx.test:BPNL00000003AYRE
              secret_alias: edc-wallet-secret
      participant:
        id: did:web:ih-provider.tx.test:BPNL00000003AYRE
        bpnl: BPNL00000003AYRE
        # plain participantContextId (EDC 0.17.0 / IH #937)
        contextId: "provider-bpnl00000003ayre"
      controlplane:
        env:
          TX_EDC_IAM_DCP_CREDENTIALSERVICE_URL: http://ih-provider.tx.test/api/credentials/v1/participants/provider-bpnl00000003ayre
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-provider.tx.test/api/credentials/v1/participants/provider-bpnl00000003ayre
        bdrs:
          server:
            url: http://bdrs-server:8082/api/directory
      dataplane:
        env:
          TX_EDC_IAM_DCP_CREDENTIALSERVICE_URL: http://ih-provider.tx.test/api/credentials/v1/participants/provider-bpnl00000003ayre
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-provider.tx.test/api/credentials/v1/participants/provider-bpnl00000003ayre

# consumer2 connector is not part of the 2-participant topology.
dataconsumerTwo:
  enabled: false

# BDRS — re-seed with the two participants' per-host DIDs.
bdrs-server-memory:
  enabled: true
  seeding:
    enabled: true
    bpnList:
      - bpn: "BPNL00000003AYRE"
        did: "did:web:ih-provider.tx.test:BPNL00000003AYRE"
      - bpn: "BPNL00000003AZQP"
        did: "did:web:ih-consumer1.tx.test:BPNL00000003AZQP"
  server:
    trustedIssuers:
      - did:web:issuer-service.tx.test:BPNL00000003CRHK
    env:
      EDC_IAM_DID_WEB_USE_HTTPS: false
    endpoints:
      management:
        authKey: TEST
