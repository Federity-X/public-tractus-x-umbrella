###############################################################
#
# Data-exchange profile: Identity Hub with PER-PARTICIPANT topology.
#
# Each dataspace participant (operator, provider, two consumers) runs its
# OWN Identity Hub behind its OWN ingress hostname. DIDs are plain
# `did:web:<participant-host>` without the extra path segment.
#
# This mirrors a real multi-organization dataspace far better than the
# shared-multi-tenant topology (`values-test-data-exchange-identity-hub.yaml`)
# but requires 4x the resources and 4x the chart instances. Use only when
# you need realistic per-org isolation — for functional testing, the
# shared profile is enough.
#
# IMPORTANT — this profile is not self-contained. The umbrella chart today
# only wires ONE Identity Hub (via the `identity-and-trust-bundle`
# sub-chart). To run per-participant Identity Hubs you additionally need
# to add dependency entries for `tractusx-identityhub-memory` under each
# of `tx-data-provider`, `dataconsumerOne`, `dataconsumerTwo` — or host
# each participant as a separate Helm release entirely. This file
# documents the target end-state and is consumed together with whatever
# chart change implements the per-participant wiring.
#
# Host plan:
#   Operator (CRHK):   ih-operator.tx.test / ih-operator-admin.tx.test
#   Provider (AYRE):   ih-provider.tx.test / ih-provider-admin.tx.test
#   Consumer1 (AZQP):  ih-consumer1.tx.test / ih-consumer1-admin.tx.test
#   Consumer2 (AVTH):  ih-consumer2.tx.test / ih-consumer2-admin.tx.test
#   Issuer Service:    issuer-service.tx.test (still shared — Tractus-X has
#                      only one Issuer per dataspace)
#
# Usage (after the per-participant wiring lands):
#   helm dependency build charts/umbrella
#   helm install umbrella charts/umbrella \
#     -f charts/values-test-data-exchange-identity-hub-per-participant.yaml \
#     --namespace umbrella --create-namespace --timeout 20m
###############################################################

wallet:
  mode: identityHub
  operatorBpn: "BPNL00000003CRHK"
  identityHub:
    topology: perParticipant
    hosts:
      operator:  "ih-operator.tx.test"
      provider:  "ih-provider.tx.test"
      consumer1: "ih-consumer1.tx.test"
      consumer2: "ih-consumer2.tx.test"

# Operator IH + Issuer Service live in the identity-and-trust-bundle.
identity-and-trust-bundle:
  enabled: true
  ssi-dim-wallet-stub:
    enabled: false
  identity-hub:
    enabled: true
    identityhub:
      iatp:
        sts:
          oauth:
            client:
              enabled: true
              id: "did:web:ih-operator.tx.test"
              secret: "operator-sts-secret"
              secret_alias: "operator-sts-secret-alias"
              x_api_key: "operator-api-key-change-me"
      ingresses:
        - enabled: true
          hostname: "ih-operator.tx.test"
          endpoints: [credentials, did, sts]
          className: "nginx"
        - enabled: true
          hostname: "ih-operator-admin.tx.test"
          endpoints: [identity, version, accounts]
          className: "nginx"
  issuer-service:
    enabled: true

# -----------------------------------------------------------------------------
# Per-participant EDC → own Identity Hub.
# DIDs are plain did:web with no extra BPN path component.
# -----------------------------------------------------------------------------
dataconsumerOne:
  enabled: true
  wallet:
    mode: identityHub
  dataspace-connector-bundle:
    tractusx-connector:
      iatp:
        id: did:web:ih-consumer1.tx.test
        trustedIssuers:
          - did:web:ih-operator.tx.test
        sts:
          dim:
            url: http://ih-consumer1.tx.test/api/sts
          oauth:
            token_url: http://ih-consumer1.tx.test/api/sts
      controlplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-consumer1.tx.test/api/credentials
        bdrs:
          server:
            url: http://bdrs-server:8081
      dataplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-consumer1.tx.test/api/credentials

tx-data-provider:
  enabled: true
  wallet:
    mode: identityHub
  dataspace-connector-bundle:
    tractusx-connector:
      iatp:
        id: did:web:ih-provider.tx.test
        trustedIssuers:
          - did:web:ih-operator.tx.test
        sts:
          dim:
            url: http://ih-provider.tx.test/api/sts
          oauth:
            token_url: http://ih-provider.tx.test/api/sts
      controlplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-provider.tx.test/api/credentials
        bdrs:
          server:
            url: http://bdrs-server:8081
      dataplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-provider.tx.test/api/credentials

dataconsumerTwo:
  enabled: true
  wallet:
    mode: identityHub
  dataspace-connector-bundle:
    tractusx-connector:
      iatp:
        id: did:web:ih-consumer2.tx.test
        trustedIssuers:
          - did:web:ih-operator.tx.test
        sts:
          dim:
            url: http://ih-consumer2.tx.test/api/sts
          oauth:
            token_url: http://ih-consumer2.tx.test/api/sts
      controlplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-consumer2.tx.test/api/credentials
        bdrs:
          server:
            url: http://bdrs-server:8081
      dataplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: http://ih-consumer2.tx.test/api/credentials

# BDRS — re-seed with per-participant DIDs.
bdrs-server-memory:
  enabled: true
  seeding:
    enabled: true
    bpnList:
      - bpn: "BPNL00000003CRHK"
        did: "did:web:ih-operator.tx.test"
      - bpn: "BPNL00000003AYRE"
        did: "did:web:ih-provider.tx.test"
      - bpn: "BPNL00000003AZQP"
        did: "did:web:ih-consumer1.tx.test"
      - bpn: "BPNL00000003AVTH"
        did: "did:web:ih-consumer2.tx.test"
  server:
    trustedIssuers:
      - did:web:ih-operator.tx.test
    env:
      EDC_IAM_DID_WEB_USE_HTTPS: false
    endpoints:
      management:
        authKey: TEST
