# Default values for identity-and-trust-bundle
# This is a YAML-formatted file.

# SSI DIM Wallet Configuration
ssi-dim-wallet-stub:
  # -- Enable SSI DIM Wallet deployment
  # @section -- Wallet Component Configuration
  enabled: true
  wallet:
    # -- Kubernetes namespace
    # @section -- Wallet Component Configuration
    nameSpace: "default"
    # @ignore
    replicaCount: 1
    # @ignore
    appName: "ssi-dim-wallet-stub"
    # @ignore
    configName: "ssi-dim-wallet-config"
    # @ignore
    serviceName: "ssi-dim-wallet-service"
    # -@ignore
    secretName: "ssi-dim-wallet-secret"
    # @ignore
    ingressName: "ssi-dim-wallet-ingress"
    seeding:
      # -- List of BPNs for which wallets will be seeded on application startup
      # @section -- Wallet Seeding Configuration
      bpnList: "BPNL00000003AZQP,BPNL00000003AYRE"
    # -- Operator BPN
    # @section -- Wallet Core Configuration
    baseWalletBpn: "BPNL00000003CRHK"
    # -- Wallet stub server URL. This will pe part of the presentation query API in the did document
    # @section -- Wallet Core Configuration
    stubUrl: "http://ssi-dim-wallet-stub.tx.test"
    # -- Default status list VC id
    # @section -- Wallet Core Configuration
    statusListVcId: "8a6c7486-1e1f-4555-bdd2-1a178182651e"
    # -- Token expiry time in seconds
    # @section -- Wallet Core Configuration
    tokenExpiryTime: "5"
    ingress:
      # -- Enable ingress creation
      # @section -- Wallet Ingress Configuration
      enabled: true
      tls:
        # -- Enable TLS
        # @section -- Wallet Ingress Configuration
        enabled: false
        # -- TLS secret name
        # @section -- Wallet Ingress Configuration
        name: ""
      # -- URL prefix
      # @section -- Wallet Ingress Configuration
      urlPrefix: /
      # @ignore
      className: nginx
      # @ignore
      annotations: {}
    # -- External hostname for wallet
    # @section -- Wallet Ingress Configuration
    host: ssi-dim-wallet-stub.tx.test
    # -- Did document host, this will be part of did String i.e., did:web:<didHost>
    # @section -- Wallet Ingress Configuration
    didHost: "ssi-dim-wallet-stub.tx.test"
    portal:
      # -- Wait for given seconds before pushing data to portal backend after wallet creation
      # @section -- (Optional) Portal Integration
      waitTime: "60"
      # -- Portal backend application host
      # @section -- (Optional) Portal Integration
      host: "http://portal-backend.tx.test"
      # -- Keycloak client_id. We will create an access token and using this we access portal backend APIs
      # @section -- (Optional) Portal Integration
      clientId: "sa-cl2-05"
      # -- (Optional) Keycloak client_secret. We will create an access token and using this we access portal backend APIs
      # @section -- (Optional) Portal Integration
      clientSecret: "changeme"
    # -- Kubernetes [liveness-probe](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
    livenessProbe:
      # -- Enables/Disables the livenessProbe at all
      enabled: true
      # -- When a probe fails, Kubernetes will try failureThreshold times before giving up. Giving up in case of liveness probe means restarting the container.
      failureThreshold: 3
      # -- Number of seconds after the container has started before readiness probes are initiated.
      initialDelaySeconds: 75
      # -- Number of seconds after which the probe times out.
      timeoutSeconds: 60
      # -- How often (in seconds) to perform the probe
      periodSeconds: 15

    # -- Kubernetes [readiness-probe](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
    readinessProbe:
      # -- Enables/Disables the readinessProbe at all
      enabled: true
      # -- When a probe fails, Kubernetes will try failureThreshold times before giving up. In case of readiness probe the Pod will be marked Unready.
      failureThreshold: 3
      # -- Number of seconds after the container has started before readiness probe are initiated.
      initialDelaySeconds: 75
      # -- How often (in seconds) to perform the probe
      periodSeconds: 15
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      successThreshold: 1
      # -- Number of seconds after which the probe times out.
      timeoutSeconds: 60
    keycloak:
      # -- Keycloak realm name
      # @section -- (Optional) Keycloak Integration
      realm: "CX-Central"
      # -- Keycloak auth server URL
      # @section -- (Optional) Keycloak Integration
      authServerUrl: "http://centralidp.tx.test/auth"
    postgresql:
      username: "postgres"
      password: "postgrespassword"
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        # -- CPU resource requests
        cpu: 500m
        # -- Memory resource requests
        memory: 1Gi
      limits:
        # -- CPU resource limits
        cpu: 1
        # -- Memory resource limits
        memory: 2Gi
  postgresql:
    fullnameOverride: wallet-postgres
    enabled: true
    configmap:
      name: wallet-postgres-configmap
    auth:
      username: postgres
      password: postgrespassword
    persistence:
      enabled: false
      size: 10Gi
      storageClass: standard

# -----------------------------------------------------------------------------
# Identity Hub (Eclipse EDC upstream Holder Wallet, Tractus-X packaging) —
# ALTERNATIVE to the stub. Disabled by default. Enable ONLY when
# `ssi-dim-wallet-stub.enabled=false`. The umbrella mutual-exclusion validator
# enforces this.
#
# The underlying chart is `tractusx-identityhub-memory` v0.3.2 (aliased to
# `identity-hub` in Chart.yaml). Its schema is documented at:
#   https://github.com/eclipse-tractusx/tractusx-identityhub/tree/main/charts/tractusx-identityhub-memory
# -----------------------------------------------------------------------------
identity-hub:
  # `condition` gate for the dependency in Chart.yaml.
  enabled: false
  # The `-memory` variant of the chart can optionally install its own PostgreSQL
  # and Vault. For the umbrella we keep them off — Vault is provided by each
  # `tx-data-provider`, and persistence is in-memory for testing.
  install:
    postgresql: false
    vault: false
  identityhub:
    # IH boots in ~30-40s on kind. Default probe (initialDelay=5s + period=5s
    # × failure=6 = ~35s) is too tight; the liveness probe trips during
    # extension boot and SIGTERMs the JVM mid-startup → CrashLoopBackOff.
    livenessProbe:
      initialDelaySeconds: 90
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 90
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 6
    # The chart sets no `resources` by default, so the cluster applies a 512Mi
    # default limit which the EDC 0.16.0 IdentityHub JVM exceeds during boot
    # (extension load + Flyway) → OOMKilled / CrashLoopBackOff. Pin a 2Gi limit.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    # NOTE: do NOT set EDC_ENCRYPTION_STRICT (or any `edc.encryption.strict`)
    # via env here. The v0.3.2 chart config (identityhub-config.yaml) already
    # emits `edc.encryption.strict: "false"`. EDC 0.16.0's ConfigFactory merges
    # env + file config and FAILS on a duplicate key even when the values match
    # (`Duplicate key edc.encryption.strict (attempted merging values false and
    # false)`) → CrashLoopBackOff. The chart default is sufficient.
    # endpoints.* keys match the real chart schema (ports 8080–8087). The
    # umbrella exposes `identity`, `credentials`, `did`, and `sts` via ingress.
    endpoints:
      identity:
        # Alias under which the Identity API master key is stored in Vault.
        # The `post-install-identityhub-seed` job uses this same alias value
        # as the literal `X-Api-Key` header when bootstrapping participants.
        authKeyAlias: "sup3r$3cr3t"
      accounts:
        authKeyAlias: "sup3r$3cr3t"
    # Initial ParticipantContext created at IH boot. This is the OPERATOR
    # participant. Additional participants (data provider, consumers) are
    # created post-install via the Identity API (see tx-data-provider hook).
    #
    # We DISABLE the chart's built-in InitialParticipantExtension
    # (`edc.tractusx.ih.participant.configurable.enable=false`) because:
    #   * its API key format validator requires base64(<DID>).<random>,
    #     which clashes with our dynamic per-participant seeding;
    #   * our post-install Job creates the operator participant explicitly
    #     using the super-user key generated at runtime by
    #     SuperUserSeedExtension.
    iatp:
      sts:
        oauth:
          client:
            enabled: false
            id: "did:web:identity-hub.tx.test:BPNL00000003CRHK"
            secret: "operator-sts-secret"
            secret_alias: "operator-sts-secret-alias"
            x_api_key: "ZGlkOndlYjppZGVudGl0eS1odWIudHgudGVzdDpCUE5MMDAwMDAwMDNDUkhL.placeholder"
    didweb:
      # In-cluster + test ingress uses HTTP, not HTTPS.
      https: false
    ingresses:
      - enabled: true
        hostname: "identity-hub.tx.test"
        endpoints:
          - credentials
          - did
          - sts
        className: "nginx"
        tls:
          enabled: false
      - enabled: true
        hostname: "identity-hub-admin.tx.test"
        endpoints:
          - identity
          - accounts
        className: "nginx"
        tls:
          enabled: false

# -----------------------------------------------------------------------------
# Identity Hub — PERSISTENT / postgres variant (`tractusx-identityhub` v0.3.2,
# aliased to `identity-hub-postgres`). Mutually exclusive with `identity-hub`
# (in-memory) and the stub; disabled by default. Full config lives in
# values-test-data-exchange-identity-hub-postgres.yaml. Unlike the in-memory
# variant, ParticipantContexts/keys/credentials persist across pod restarts
# (bundled postgres + vault), so no re-seed is needed after a restart.
# -----------------------------------------------------------------------------
identity-hub-postgres:
  enabled: false

# -----------------------------------------------------------------------------
# Issuer Service — companion to Identity Hub (`tractusx-issuerservice` v0.3.2,
# aliased to `issuer-service`). Issues VCs into each participant's
# ParticipantContext via the DCP Credential Issuance Protocol (CIP).
#
# We use the **postgres** variant (NOT `-memory`) because only its image
# bundles the upstream `issuerservice-database-attestations` module that
# registers the `database` attestation factory required by §5 of the DCP
# walkthrough (`{ "attestationType": "database", configuration: { dataSourceName,
# tableName } }`). The memory image only registers the `presentation`
# attestation, which cannot bootstrap initial credential issuance.
# The chart bundles its own ephemeral PostgreSQL + HashiCorp Vault sub-charts
# (dev mode), so no external infra is required for the umbrella's local
# (kind) profile. Persistence is disabled — kind clusters are ephemeral.
# -----------------------------------------------------------------------------
issuer-service:
  enabled: false
  # Bundled subcharts: ephemeral postgres + dev-mode vault. Defaults inside
  # `tractusx-issuerservice` already set both to true; we make it explicit
  # for clarity and to be robust against any future default change.
  install:
    postgresql: true
    vault: true
  # PostgreSQL subchart (bitnamilegacy/postgresql, chart 12.12.x). The chart's
  # auto-generated `issuerservice-datasource-config` ConfigMap wires every
  # IS subsystem (holder, attestationdefinitions, credentialdefinitions,
  # issuanceprocess, did, keypair, stsclient) to this single database via
  # JDBC URL `jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/issuer`.
  # The Flyway migrations bundled in the postgres image create every required
  # table on first boot — including `holders` (subsystem `holder`), which the
  # database attestation in §5 of the seed Job queries via
  # `dataSourceName: "holder", tableName: "holders"`.
  #
  # IMPORTANT: `nameOverride: issuer-postgresql` is required to avoid a label
  # clash with `dataprovider-digital-twin-db` (also a bitnami postgresql with
  # `app.kubernetes.io/instance: umbrella, app.kubernetes.io/name: postgresql`).
  # Without this override the `umbrella-postgresql` Service selects pods from
  # both StatefulSets and IS connections randomly land on the wrong database
  # → `FATAL: database "issuer" does not exist`. We pair the override with an
  # explicit `jdbcUrl` so the IS chart's auto-generated datasource ConfigMap
  # points at the correctly-named Service (`umbrella-issuer-postgresql`).
  postgresql:
    nameOverride: issuer-postgresql
    # Override JDBC URL to match the renamed postgres Service. Must keep the
    # `/issuer` database suffix — that's the DB the bitnami chart auto-creates
    # from `postgresql.auth.database` (default "issuer" upstream).
    jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-issuer-postgresql:5432/issuer"
    # CRITICAL: PVC-backed persistence WITH delete-on-uninstall retention.
    #
    # The IS chart's postgres dependency is the cloudpirates `postgres` chart,
    # whose persistence flag lives at the TOP LEVEL (`persistence.enabled`),
    # NOT under `primary.persistence`.
    #
    # We use a PVC (not emptyDir) because the IssuerService keeps its issued
    # credentials AND the status-list credentials that every issued VC points
    # at (`credentialStatus.statusListCredential`). With emptyDir, ANY restart
    # of this postgres pod (node pressure, eviction, kubelet churn) WIPES that
    # DB while the long-lived IssuerService pod keeps running against it. The
    # status-list endpoint then 500s/404s, the IdentityHub `CredentialWatchdog`
    # cannot resolve credential status, and it moves every holder credential to
    # the `ERROR` (VcStatus -100) state — which silently breaks the whole DCP
    # data-exchange flow (empty catalogs, "No BPN entry found for agreement").
    #
    # `persistentVolumeClaimRetentionPolicy.whenDeleted: Delete` keeps the
    # original clean-reinstall guarantee: the PVC is removed on `helm uninstall`
    # so a fresh install starts from an empty DB and the postgres-backed IS
    # re-emits its one-time super-user API key for the seed Job to scrape.
    # Net: survives restarts (the real failure mode) AND stays clean across
    # uninstall/reinstall. `storageClass: ""` uses the cluster default.
    persistence:
      enabled: true
      storageClass: ""
      size: 2Gi
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenDeleted: Delete
      whenScaled: Retain
  # Override JDBC URL to match the renamed postgres Service. Must keep the
  # `/issuer` database suffix — that's the DB the bitnami chart auto-creates
  # from `postgresql.auth.database` (default "issuer" upstream).
  jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-issuer-postgresql:5432/issuer"
  # HashiCorp Vault subchart (chart 0.29.1) running in dev mode with a
  # well-known root token ("root"). Suitable ONLY for local/test profiles.
  # The IS uses the vault to store generated key material (per-participant
  # keypair private keys + JDBC creds resolved by the Tractus-X migration
  # extension `AbstractPostgresqlMigrationExtension`).
  vault:
    server:
      dev:
        enabled: true
        devRootToken: "root"
  issuerservice:
    # Wait for the bundled PostgreSQL to accept TCP connections BEFORE the
    # IssuerService JVM starts. EDC 0.16.0's Flyway bootstrap aborts the whole
    # runtime (exit 1) on a cold-postgres `SocketTimeoutException: Connect timed
    # out`. That first-boot crash is catastrophic for seeding: the postgres-
    # backed IS emits its super-user API key only ONCE — on the boot that first
    # creates the `super-user` ParticipantContext — and never reprints it on a
    # later boot ("super-user already exists ... will not re-create"). After a
    # restart the key has scrolled out of `kubectl logs --previous`, so the
    # post-install-identityhub-seed Job can no longer scrape it and fails with
    # "could not extract super-user API key". Gating the JVM on postgres
    # readiness guarantees a single clean boot that keeps the key in the
    # pod's current logs.
    # NOTE: the chart renders `initContainers` via `toYaml` (NOT `tpl`), so the
    # postgres Service name must be a literal. The umbrella local/test profiles
    # always `helm install umbrella`, so the Service is `umbrella-issuer-postgresql`.
    initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "[wait-for-postgres] waiting for umbrella-issuer-postgresql:5432 ...";
            until nc -z umbrella-issuer-postgresql 5432; do
              echo "[wait-for-postgres] not ready, retry in 2s"; sleep 2;
            done;
            echo "[wait-for-postgres] postgres is reachable";
    # Postgres-backed IS needs longer probe windows than the in-memory variant.
    # Default initialDelay=5s + period=5s × failure=6 = ~35s, which is too tight
    # when the pod must wait for the bundled postgres + vault subcharts to be
    # reachable AND run Flyway migrations across all 7 IS subsystems.
    livenessProbe:
      initialDelaySeconds: 90
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 90
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 6
    # The chart sets no `resources` by default, so the cluster applies a 512Mi
    # default limit which the EDC 0.16.0 IssuerService JVM exceeds during boot
    # (extension load + Flyway across 7 subsystems) → OOMKilled. Pin a 2Gi limit.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    # NOTE: do NOT set EDC_ENCRYPTION_STRICT (or any `edc.encryption.strict`)
    # via env here. The v0.3.2 chart config (issuerservice-config.yaml) already
    # emits `edc.encryption.strict: "false"`. EDC 0.16.0's ConfigFactory FAILS
    # on a duplicate key even when the values match
    # (`Duplicate key edc.encryption.strict`) → CrashLoopBackOff.
    didweb:
      https: false
    ingresses:
      - enabled: true
        hostname: "issuer-service.tx.test"
        endpoints:
          - issuance
          - did
          - statuslist
        className: "nginx"
        tls:
          enabled: false
      - enabled: true
        hostname: "issuer-service-admin.tx.test"
        endpoints:
          - issueradmin
          - identity
        className: "nginx"
        tls:
          enabled: false
