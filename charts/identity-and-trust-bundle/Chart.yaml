apiVersion: v2
name: identity-and-trust-bundle
description: |
  Helm chart for Capability Bundle: Identity and Trust

  The Identity & Trust Bundle provides identity management and authentication services for the Catena-X ecosystem.

  For more information on the SSI DIM Wallet stub application, see https://github.com/eclipse-tractusx/ssi-dim-wallet-stub

home: https://github.com/eclipse-tractusx/tractus-x-umbrella/tree/main/charts/identity-and-trust-bundle

sources:
  - https://github.com/eclipse-tractusx/tractus-x-umbrella/tree/main/charts/identity-and-trust-bundle

type: application
version: 1.1.2

dependencies:
  - name: ssi-dim-wallet-stub
    version: 0.1.14
    repository: https://eclipse-tractusx.github.io/charts/dev
    condition: ssi-dim-wallet-stub.enabled
  # -- Tractus-X Identity Hub (in-memory variant) — Eclipse EDC upstream Holder
  #    Wallet packaged for Tractus-X. Disabled by default; enable ONLY as an
  #    alternative to `ssi-dim-wallet-stub`. The umbrella validator
  #    (templates/_wallet-validate.tpl) enforces mutual exclusion.
  #    The `-memory` variant matches the umbrella's in-memory testing profile
  #    (no PostgreSQL dependency).
  #    Source: https://github.com/eclipse-tractusx/tractusx-identityhub
  - name: tractusx-identityhub-memory
    alias: identity-hub
    version: v0.2.0
    repository: https://eclipse-tractusx.github.io/charts/dev
    condition: identity-hub.enabled
  # -- Issuer Service companion to Identity Hub. Issues Verifiable Credentials
  #    into each participant's ParticipantContext via the DCP Credential
  #    Issuance Protocol (CIP). Disabled by default.
  #
  #    NOTE: we use the **postgres** variant (NOT `-memory`) because only the
  #    postgres image bundles the upstream
  #    `:extensions:issuance:issuerservice-database-attestations` module that
  #    registers the `database` attestation factory. That factory is required
  #    by §5 of the upstream DCP walkthrough — without it the IssuerService
  #    rejects the attestation POST with `400 Unknown attestation type:
  #    database`. The memory image only registers the `presentation`
  #    attestation, which cannot be used to bootstrap initial credential
  #    issuance (it requires an existing VP from the holder).
  #    The chart bundles its own ephemeral PostgreSQL + HashiCorp Vault
  #    sub-charts (dev mode), so no external infra is required.
  #    Source: https://github.com/eclipse-tractusx/tractusx-identityhub
  - name: tractusx-issuerservice
    alias: issuer-service
    version: v0.2.0
    repository: https://eclipse-tractusx.github.io/charts/dev
    condition: issuer-service.enabled
