###############################################################
#
# BE-293 CALLBACK ACTIVATION (layer on the durable Postgres IdentityHub).
#
# 1. Pins the IdentityHub super-user key (edc.ih.api.superuser.key). The
#    SuperUserSeedExtension only logs the key on FIRST creation and skips a
#    pre-existing super-user, so without a pin the key is unrecoverable after the
#    creating pod's logs rotate. Pinning gives a STABLE key that survives IH
#    restarts — required so both the seed (scrapes it from the log) and the Portal
#    (IdentityHub:ApiKey) keep working across restarts. Format:
#    base64(participantId) "." base64(secret).
#    NOTE: pinning only takes effect when the super-user is (re)created, so the IH
#    Postgres DB must be fresh/wiped when this is first applied.
#
# 2. Activates the portal-credential-callback observer extension by configuring
#    tx.portal.callback.* on the IH runtime. On a holder credential request
#    reaching ISSUED/ERROR the extension gets a centralidp client-credentials token
#    and POSTs the Portal's issuer callback
#    (/api/administration/registration/issuer/{bpn|membership}credential), which
#    advances the onboarding AWAIT_*_CREDENTIAL_RESPONSE checklist step.
#    client-id = sa-cl24-01: the ONLY base service account assigned BOTH
#    Cl2-CX-Portal client roles update_application_bpn_credential +
#    update_application_membership_credential (verified in the CX-Central realm
#    seed). Secret = the umbrella default "changeme".
###############################################################

identity-and-trust-bundle:
  identity-hub-postgres:
    identityhub:
      env:
        # (1) stable, known super-user key (see header)
        EDC_IH_API_SUPERUSER_KEY: "c3VwZXItdXNlcg==.cG9ydGFsYmUyOTNzdXBlcnVzZXJmaXhlZGtleTEyMzQ1Njc4OTA="
        # (2) activate the portal-credential-callback observer extension
        TX_PORTAL_CALLBACK_BASE_URL: "http://portal-backend.tx.test"
        TX_PORTAL_CALLBACK_TOKEN_URL: "http://centralidp.tx.test/auth/realms/CX-Central/protocol/openid-connect/token"
        TX_PORTAL_CALLBACK_CLIENT_ID: "sa-cl24-01"
        TX_PORTAL_CALLBACK_CLIENT_SECRET: "changeme"

# Portal worker uses the SAME pinned super-user key to drive IdentityHub wallet ops.
portal:
  backend:
    processesworker:
      identityHub:
        apiKey: "c3VwZXItdXNlcg==.cG9ydGFsYmUyOTNzdXBlcnVzZXJmaXhlZGtleTEyMzQ1Njc4OTA="
