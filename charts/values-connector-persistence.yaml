###############################################################
#
# CONNECTOR POSTGRES PERSISTENCE (focused durability overlay).
#
# Gives every connector's (dataspace-connector-bundle) Postgres a PVC so the EDC
# schema survives pod recreation. Without this the connector DBs are emptyDir, so
# ANY `helm upgrade` (which re-applies the StatefulSets) or pod eviction wipes the
# EDC schema — the control planes then fail with
#   org.postgresql...ERROR: relation "edc_contract_negotiation" does not exist
# and asset/negotiation calls 500, breaking DCP until the control planes are
# restarted to re-provision the schema. (Observed exactly this on the portal
# `helm upgrade`.) A narrower alternative to values-persistent-local.yaml: this
# touches ONLY the three connectors, leaving CentralIDP / submodel-backend as-is.
#
# Also widens the control-plane liveness/readiness budget: enabling persistence
# adds a PVC-attach delay to boot, and the chart's default liveness probe
# (initialDelay 30 + 6x10 ≈ 90s) can SIGTERM-kill a contended boot before it
# finishes (exitCode 143), leaving a half-initialised control plane. ~90 + 20x15 ≈
# 390s lets a contended boot complete. Harmless on a fast node.
#
# NOTE: switching a StatefulSet emptyDir→PVC changes the immutable
# `volumeClaimTemplates`, so the existing connector-DB StatefulSets must be DELETED
# once before the upgrade that first applies this overlay (helm then recreates them
# with the PVC). Fresh installs are unaffected.
###############################################################

tx-data-provider:
  dataspace-connector-bundle:
    tractusx-connector:
      controlplane:
        livenessProbe:
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 20
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 20
    postgresql:
      primary:
        persistence:
          enabled: true
          size: 5Gi

