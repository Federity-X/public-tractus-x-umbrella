---
apiVersion: v2
name: umbrella
description: |
  A Helm chart to spin up Tractus-X OSS components to simulate a complete dataspace network.

  With this Helm chart you are able to run end-to-end or create a sandbox environment.

sources:
  - https://github.com/eclipse-tractusx/tractus-x-umbrella

type: application
version: 3.17.0

# when adding or updating versions of dependencies, also update list under /docs/user/linux/installation/README.md
dependencies:
  # portal
  - condition: portal.enabled
    name: portal
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 2.6.0
  # cx-iam
  - condition: centralidp.enabled
    name: centralidp
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 4.2.1
  - condition: sharedidp.enabled
    name: sharedidp
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 4.2.1
  # discovery-finder
  - condition: discoveryfinder.enabled
    name: discoveryfinder
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 0.5.1
    # bpn-discovery
  - condition: bpndiscovery.enabled
    name: bpndiscovery
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 0.5.1
    # sd-factory
  - condition: selfdescription.enabled
    name: sdfactory
    alias: selfdescription
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 2.1.35
    # ssi-credential-issuer
  - name: ssi-credential-issuer
    condition: ssi-credential-issuer.enabled
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 1.4.0
  # semantic-hub
  - condition: semantic-hub.enabled
    name: semantic-hub
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 0.5.0
  # Business Partner Data Management
  - name: bpdm
    condition: bpdm.enabled
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 6.2.0
    # TX Data Consumer 1
  - name: tx-data-provider
    alias: dataconsumerOne
    version: 0.5.0
    repository: file://../tx-data-provider
    condition: dataconsumerOne.enabled
    # TX Data Providers
  - name: tx-data-provider
    version: 0.5.0
    repository: file://../tx-data-provider
    condition: tx-data-provider.enabled
    # TX Data Consumer 2
  - name: tx-data-provider
    alias: dataconsumerTwo
    version: 0.5.0
    repository: file://../tx-data-provider
    condition: dataconsumerTwo.enabled
    # pgadmin4 as helper tool for easy database access
  - condition: pgadmin4.enabled
    name: pgadmin4
    repository: https://helm.runix.net
    version: 1.25.x
    # bdrs
  - name: bdrs-server-memory
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 0.6.0
    condition: bdrs-server-memory.enabled
  # Persistent (PostgreSQL-backed) BDRS for the durable profiles. Mutually
  # exclusive with bdrs-server-memory (both render as `bdrs-server` via
  # fullnameOverride, so exactly one may be enabled). Default OFF; the postgres
  # profiles flip bdrs-server-memory.enabled=false + bdrs-server.enabled=true so
  # the BPN->DID directory survives a BDRS pod/VM restart.
  - name: bdrs-server
    repository: https://eclipse-tractusx.github.io/charts/dev
    version: 0.6.0
    condition: bdrs-server.enabled
  - name: identity-and-trust-bundle
    repository: file://../identity-and-trust-bundle
    version: 1.2.0
    condition: identity-and-trust-bundle.enabled
  # -- Per-participant IdentityHub instances (#1609 per-participant topology).
  #    In the default `shared` topology these stay DISABLED and a single
  #    IdentityHub (provided by identity-and-trust-bundle, hosting all four
  #    ParticipantContexts) is used. The per-participant profile
  #    (values-test-data-exchange-identity-hub-per-participant.yaml) enables
  #    these three aliases so that the provider and the two consumers each get
  #    their OWN Holder Wallet; the operator keeps the bundle's IdentityHub.
  #    Same chart + version as the bundle (in-memory variant, no PostgreSQL).
  #    Source: https://github.com/eclipse-tractusx/tractusx-identityhub
  - name: tractusx-identityhub-memory
    alias: identity-hub-provider
    version: v0.3.2
    repository: https://eclipse-tractusx.github.io/charts/dev
    condition: identity-hub-provider.enabled
  - name: tractusx-identityhub-memory
    alias: identity-hub-consumer1
    version: v0.3.2
    repository: https://eclipse-tractusx.github.io/charts/dev
    condition: identity-hub-consumer1.enabled
  - name: tractusx-identityhub-memory
    alias: identity-hub-consumer2
    version: v0.3.2
    repository: https://eclipse-tractusx.github.io/charts/dev
    condition: identity-hub-consumer2.enabled
  # -- Per-participant IdentityHub — PERSISTENT / postgres variant for consumer1.
  #    Same `tractusx-identityhub` (postgres) chart the bundle exposes as
  #    `identity-hub-postgres`, aliased here so the per-participant topology can
  #    give consumer1 its OWN durable Holder Wallet (ParticipantContexts + issued
  #    credentials survive a pod restart). The provider reuses the bundle's
  #    `identity-hub-postgres`, so only consumer1 needs a dedicated umbrella-level
  #    alias. Enabled by
  #    values-test-data-exchange-identity-hub-per-participant-postgres.yaml;
  #    the in-memory `identity-hub-consumer1` above stays the default.
  #    Source: https://github.com/eclipse-tractusx/tractusx-identityhub
  - name: tractusx-identityhub
    alias: identity-hub-consumer1-postgres
    version: v0.3.2
    repository: https://eclipse-tractusx.github.io/charts/dev
    condition: identity-hub-consumer1-postgres.enabled
  # OTEL Collector
  - name: opentelemetry-collector
    alias: opentelemetry-collector
    version: "0.126.0"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-collector.enabled
  # Jaeger
  - name: jaeger
    alias: jaeger
    version: "3.0.7"
    repository: https://jaegertracing.github.io/helm-charts
    condition: jaeger.enabled
  # Prometheus
  - name: prometheus
    alias: prometheus
    repository: https://prometheus-community.github.io/helm-charts
    version: "27.1.0"
    condition: prometheus.enabled
  # Loki
  - name: loki
    alias: loki
    version: "6.27.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  # Grafana
  - name: grafana
    alias: grafana
    version: "8.10.1"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
  # Cert-Manager
  - name: cert-manager
    version: v1.18.2
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
