---
# BE-293 — IdentityHub as the onboarding wallet.
#
# Layer ON TOP of values-adopter-portal.yaml (and the same onboarding components
# as values-adopter-portal-onboarding.yaml), but switch the wallet from the stub
# to IdentityHub + IssuerService and point the Portal backend at the forked
# BE-293 images. See docs/internal/BE-293-architecture-callback.md.
#
#   helm upgrade --install umbrella charts/umbrella \
#     -f charts/umbrella/values-adopter-portal.yaml \
#     -f charts/umbrella/values-adopter-portal-onboarding-identityhub.yaml \
#     --namespace <ns> --create-namespace
#
# NOTE: three values must be finalised against the live IssuerService seed and are
# marked TODO below (bpn/membership credential-definition ids) — the IdentityHub
# super-user key is PINNED here so the Portal has a stable key.

# In-cluster did:web resolver shim (templates/didweb-resolver.yaml) so VALIDATE_DID_DOCUMENT can
# resolve did:web:*.tx.test. Sandbox-only; see D11 for the production path.
didwebResolver:
  enabled: true

# ---- wallet: IdentityHub (shared multi-tenant IH hosts all onboarded holders) ----
wallet:
  mode: identityHub
  identityHub:
    # we set the IH/IssuerService images below to the locally-built (kind-loaded) ones
    imagesOverridden: true
  # operatorBpn + identityHub.shared.host/issuerServiceHost inherit from values.yaml
  # (BPNL00000003CRHK / identity-hub.tx.test / issuer-service.tx.test).

# ---- onboarding components (same as values-adopter-portal-onboarding.yaml) ----
bpdm:
  enabled: true
bdrs-server-memory:
  enabled: true
  # bdrs-server-memory:0.6.0 does not expose /api/check/readiness (only /check/liveness); the
  # chart's readiness probe 404s forever → pod never Ready → Service has no endpoints. Liveness
  # guards the pod, so disable the broken readiness probe.
  server:
    readinessProbe:
      enabled: false
selfdescription:
  enabled: true
smtp4dev:
  enabled: true
bpndiscovery:
  enabled: true
  postgresql:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "15-debian-11"
discoveryfinder:
  enabled: true
  postgresql:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "15-debian-11"

# ssi-credential-issuer is REPLACED by the IssuerService (identity-and-trust-bundle);
# leaving both on would double-provision the issuer path.
ssi-credential-issuer:
  enabled: false

# IdentityHub + IssuerService (forked images carry the portal-credential-callback observer
# extension). The bundle's image wiring + a PINNED super-user key + the tx.portal.callback.*
# settings are applied via -f charts/values-test-data-exchange-identity-hub-local-0.17.0.yaml
# plus the identity-hub-be293 additions below.
identity-and-trust-bundle:
  enabled: true
  # the stub wallet is mutually exclusive with IdentityHub (wallet validator enforces this).
  ssi-dim-wallet-stub:
    enabled: false
  # Shared IH (memory) hosts all onboarded holders; it runs the portal-credential-callback
  # observer extension (baked into the forked docker-identityhub-memory image).
  identity-hub:
    enabled: true
    identityhub:
      image:
        repository: docker-identityhub-memory
        tag: latest
        pullPolicy: Never
      # BE-293 (IH callback): the portal-credential-callback observer dedups delivered callbacks
      # IN-MEMORY per replica; >1 replica => N duplicate callbacks per terminal request. Keep at 1
      # until the extension gains a persisted marker / leader election (extension UPSTREAM-ISSUE.md).
      replicaCount: 1
      # Arbitrary EDC settings passed as env (the subchart ranges over identityhub.env).
      # EDC maps env NAME -> config key by lowercasing and turning _ into . or - .
      env:
        # PIN the super-user key so the Portal has a STABLE Identity-API key across boots
        # (otherwise SuperUserSeedExtension generates a new one each boot). Format:
        # base64(participantId "super-user")="c3VwZXItdXNlcg==" + "." + secret. Applies to a
        # FRESH IH (the super-user participant is created once at first boot).
        EDC_IH_API_SUPERUSER_KEY: "c3VwZXItdXNlcg==.cG9ydGFsYmUyOTNzdXBlcnVzZXJmaXhlZGtleTEyMzQ1Njc4OTA="
        # Portal callback (activates the observer extension). Requires the Keycloak technical-user
        # client below; TOKEN_URL is centralidp's token endpoint.
        TX_PORTAL_CALLBACK_BASE_URL: "http://portal-backend.tx.test"
        TX_PORTAL_CALLBACK_TOKEN_URL: "http://centralidp.tx.test/auth/realms/CX-Central/protocol/openid-connect/token"
        # MUST be sa-cl24-01 — it is the ONLY base service account in the CX-Central realm seed
        # granted BOTH Cl2-CX-Portal roles update_application_bpn_credential AND
        # update_application_membership_credential, which the Portal issuer callback endpoints
        # (/api/administration/registration/issuer/{bpn,membership}credential) require. sa-cl2-01
        # holds only update_application_checklist_value → every callback 403s and (with the
        # observer's terminal-4xx handling) the onboarding AWAIT_*_CREDENTIAL_RESPONSE step stalls.
        # Keep this in sync with charts/values-callback-activation.yaml (the single source of truth
        # for the callback client) — do not diverge the two.
        TX_PORTAL_CALLBACK_CLIENT_ID: "sa-cl24-01"
        TX_PORTAL_CALLBACK_CLIENT_SECRET: "REPLACE_WITH_SA_CLIENT_SECRET"
        # BE-293 §5: single-source the credential-type strings via YAML anchors so the IH extension
        # (these keys) and the Portal backend (portal.backend.processesworker.identityHub.*CredentialType
        # below) can never drift; both MUST equal the issued VC `type`.
        TX_PORTAL_CALLBACK_BPN_CREDENTIAL_TYPE: &bpnCredType "BpnCredential"
        TX_PORTAL_CALLBACK_MEMBERSHIP_CREDENTIAL_TYPE: &membershipCredType "MembershipCredential"
  # IssuerService is unchanged by BE-293 (the observer is holder-side) — uses the existing image.
  issuer-service:
    enabled: true
    issuerservice:
      image:
        repository: docker-issuerservice
        tag: latest
        pullPolicy: Never
      # The bundle's default wait-for-postgres init container hardcodes the host
      # `umbrella-issuer-postgresql` (it's rendered via toYaml, not tpl, so it can't use
      # Release.Name). This deploy's release is `portal-c`, so override the host to match.
      # (The IssuerService datasource jdbcUrl already templates Release.Name correctly.)
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "[wait-for-postgres] waiting for portal-c-issuer-postgresql:5432 ...";
              until nc -z portal-c-issuer-postgresql 5432; do
                echo "[wait-for-postgres] not ready, retry in 2s"; sleep 2;
              done;
              echo "[wait-for-postgres] postgres is reachable";

# ---- Portal backend: forked BE-293 images + IdentityHub issuer wiring ----
portal:
  enabled: true
  backend:
    # deployment-wide onboarding wallet provider (drives the IDENTITY_WALLET entry,
    # the wallet step type, and the issuer-component selector)
    walletProvider: "IdentityHub"
    registration:
      image:
        name: "tractusx/portal-registration-service"
        registrationservicetag: "be293"
        pullPolicy: "Never"
    administration:
      image:
        name: "tractusx/portal-administration-service"
        administrationservicetag: "be293"
        pullPolicy: "Never"
    portalmigrations:
      image:
        name: "tractusx/portal-migrations"
        portalmigrationstag: "be293"
        pullPolicy: "Never"
    processesworker:
      image:
        name: "tractusx/portal-processes-worker"
        processesworkertag: "be293"
        pullPolicy: "Never"
      # IdentityHub onboarding-wallet + issuer config (shared topology). Only rendered when
      # identityHub.enabled=true (portal-chart BE-293 patch).
      identityHub:
        enabled: true
        # Participant-management (identity) API is served on the ADMIN ingress host; the public
        # identity-hub.tx.test 405s on POST /participants. credentialService/didDocument stay public.
        baseAddress: "http://identity-hub-admin.tx.test/api/identity"
        didDocumentBaseLocation: "identity-hub.tx.test"
        credentialServiceBaseAddress: "http://identity-hub.tx.test/api/credentials"
        issuerDid: "did:web:issuer-service.tx.test:BPNL00000003CRHK"
        # IssuerService credential-definition ids are fixed by the seed (cred_def_id_for = tx-<type>).
        bpnCredentialDefinitionId: "tx-bpncredential"
        membershipCredentialDefinitionId: "tx-membershipcredential"
        # BE-293 §5: credential TYPE strings, single-sourced via the anchors on the IH runtime's
        # TX_PORTAL_CALLBACK_*_CREDENTIAL_TYPE above; the backend renders these into
        # APPLICATIONCHECKLIST__IDENTITYHUB__{BPN,MEMBERSHIP}CREDENTIALTYPE, so a drift is impossible.
        bpnCredentialType: *bpnCredType
        membershipCredentialType: *membershipCredType
        # IssuerService holder registration (F6) — see values-combined-portal-additions.yaml for the
        # rationale. Required before credential requests, else DCP 401 "Participant not found".
        issuerAdminBaseAddress: "http://issuer-service-admin.tx.test/api/admin"
        issuerAdminApiKey: "c3VwZXItdXNlcg==.aXNzdWVyYmUyOTNzdXBlcnVzZXJmaXhlZGtleTEyMzQ1Njc4OTA="
        issuerParticipantId: "issuer-bpnl00000003crhk"
        frameworkContractVersion: "1.0"
        # IdentityHub Identity-API super-user key. Must live under identityHub (the chart's secret binds
        # identityHub.apiKey), NOT dim. Live testing showed authKeyAlias (sup3r$3cr3t) is NOT accepted by
        # the Identity API (401); the participant API requires the SuperUserSeedExtension key. Pinned via
        # EDC_IH_API_SUPERUSER_KEY so it's stable.
        apiKey: "c3VwZXItdXNlcg==.cG9ydGFsYmUyOTNzdXBlcnVzZXJmaXhlZGtleTEyMzQ1Njc4OTA="
        # BE-293: the newer backend resolves the holder's did:web via IdentityHub:UniversalResolverAddress
        # ([Required]) instead of the DIM setting — point it at the same in-cluster resolver shim.
        universalResolverAddress: "http://didweb-resolver:8080/"
        # VALIDATE_DID_DOCUMENT deadline (days) before the step fails for a manual retrigger ([Range] >= 1).
        maxValidationTimeInDays: 7
      dim:
        # VALIDATE_DID_DOCUMENT resolves the new did:web via the in-cluster resolver shim
        # (didwebResolver.enabled below; chart template templates/didweb-resolver.yaml). See D11.
        # Production: publish DIDs on public HTTPS and point at a real Universal Resolver instead.
        universalResolverAddress: "http://didweb-resolver:8080/"
