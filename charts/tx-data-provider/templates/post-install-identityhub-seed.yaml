{{- /*
   Post-install hook: seed IdentityHub + IssuerService with all participants
   declared in the umbrella chart's `wallet.participants` map.

   Implements the DCP provisioning walkthrough from upstream
   tractusx-identityhub @ v0.2.0:
   https://github.com/eclipse-tractusx/tractusx-identityhub/tree/main/docs/usage/dcp-api-walkthrough

   --------------------------------------------------------------------------
   API surface (v0.2.0, verified against the upstream Bruno collection):

     IdentityHub  POST /api/identity/v1alpha/participants               (create ctx)
     IdentityHub  PUT  /api/identity/v1alpha/participants/{ctx}/keypairs (extra key)
     IdentityHub  POST /api/identity/v1alpha/participants/{ctx}/state?isActive=true  (activate + publish DID)
     IdentityHub  GET  /api/identity/v1alpha/participants/{ctx}/credentials          (verify VC store)

     IssuerSvc    POST /api/identity/v1alpha/participants               (create issuer ctx — IS uses
                                                                          the same identity API surface)
     IssuerSvc    POST /api/identity/v1alpha/participants/{ctx}/state?isActive=true  (activate)
     IssuerSvc    POST /api/issueradmin/v1alpha/participants/{issuerCtx}/holders         (register holder)
     IssuerSvc    POST /api/issueradmin/v1alpha/participants/{issuerCtx}/credentialdefinitions

   Auth: every admin call carries `x-api-key: <key>`. The key is generated
         on first boot by SuperUserSeedExtension and printed once to the
         pod log; we extract it via `kubectl logs`.
   --------------------------------------------------------------------------

   Flow:
     0. Wait for IH/IS pods to be Ready.
     1. Extract super-user API keys from IH/IS pod logs.
     2. SETUP — bootstrap the issuer's own ParticipantContext on IS
        (create + activate). Idempotent.
     3. PER PARTICIPANT (consumers + provider):
          a. Create holder ParticipantContext on IH (with inline keypair).
          b. Activate holder ctx (publishes did:web).
          c. Register holder with IssuerService.
     4. Emit a final SEED SUMMARY line.

   NOT (yet) implemented in this hook:
     * Issuance of concrete VerifiableCredentials (MembershipCredential,
       FrameworkAgreement.*, etc.). This requires a real DCP exchange
       between IH and IS and is exercised end-to-end by the data-flow
       tests rather than provisioned synchronously here.

   Idempotency: every POST tolerates HTTP 409 (already-exists).
   Failure semantics: any unexpected ≥400 response fails the Job, which
   in turn fails `helm install`.
*/ -}}
{{- if and (eq (.Values.wallet.mode | default "stub") "identityHub") .Values.wallet.identityHubSeed.enabled }}
{{- $fullName := include "dataprovider.fullname" . -}}
{{- $seed := .Values.wallet.identityHubSeed -}}
{{- $cmName := .Values.wallet.derivedConfigMap | default (printf "%s-wallet-mode" .Release.Name) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-post-install-identityhub-seed
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    tractusx.eclipse.org/wallet-mode: "identityHub"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      name: {{ $fullName }}-ih-seed
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      serviceAccountName: {{ $fullName }}-ih-seed
      restartPolicy: Never
      volumes:
        - name: wallet-data
          configMap:
            name: {{ $cmName }}
      containers:
        - name: ih-seed
          image: {{ $seed.image | quote }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: wallet-data
              mountPath: /etc/wallet
              readOnly: true
          env:
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: IH_POD_LABEL
              value: {{ $seed.identityHubPodLabel | quote }}
            - name: IS_POD_LABEL
              value: {{ $seed.issuerServicePodLabel | quote }}
            - name: READINESS_TIMEOUT
              value: {{ $seed.readinessTimeoutSeconds | quote }}
          command: ["/bin/bash", "-eu", "-o", "pipefail", "-c"]
          args:
            - |
              set -eu -o pipefail

              IH_IDENTITY=$(cat /etc/wallet/identity-hub-internal-identity-api)
              IS_IDENTITY=$(cat /etc/wallet/issuer-service-internal-identity-api)
              IS_ISSUERADMIN=$(cat /etc/wallet/issuer-service-internal-issueradmin-api)
              ISSUER_DID=$(cat /etc/wallet/issuer-did)
              ISSUER_PID=$(cat /etc/wallet/issuer-participant-id)
              ISSUER_PID_B64=$(cat /etc/wallet/issuer-participant-id-b64)

              echo "[ih-seed] identity-hub identity API     = $IH_IDENTITY"
              echo "[ih-seed] issuer-service identity API   = $IS_IDENTITY"
              echo "[ih-seed] issuer-service issueradmin    = $IS_ISSUERADMIN"
              echo "[ih-seed] issuer DID                    = $ISSUER_DID"
              echo "[ih-seed] issuer participant id         = $ISSUER_PID"
              echo "[ih-seed] issuer participant id (b64)   = $ISSUER_PID_B64"

              ########################################################
              # Step 0: Wait for IH + IS pods to be Ready.
              ########################################################
              echo "[ih-seed] waiting for IH/IS pods to be Ready (timeout=${READINESS_TIMEOUT}s)"
              kubectl -n "$NAMESPACE" wait --for=condition=Ready pod \
                -l "$IH_POD_LABEL" --timeout="${READINESS_TIMEOUT}s"
              kubectl -n "$NAMESPACE" wait --for=condition=Ready pod \
                -l "$IS_POD_LABEL" --timeout="${READINESS_TIMEOUT}s"

              ########################################################
              # Step 1: extract super-user API keys from pod logs.
              # The SuperUserSeedExtension logs once at startup:
              #   "[SuperUserSeedExtension] Created user 'super-user'.
              #    Please take note of the API Key: <base64>.<token>"
              ########################################################
              extract_api_key() {
                local label="$1"
                local pod
                pod=$(kubectl -n "$NAMESPACE" get pod -l "$label" \
                  -o jsonpath='{.items[0].metadata.name}')
                local key
                key=$(kubectl -n "$NAMESPACE" logs "$pod" --tail=-1 \
                  | grep -oE "Please take note of the API Key:[[:space:]]+[A-Za-z0-9+/=._-]+" \
                  | head -n1 \
                  | sed -E "s/.*:[[:space:]]+//")
                if [ -z "$key" ]; then
                  echo "[ih-seed] FATAL: could not extract super-user API key from pod $pod" >&2
                  kubectl -n "$NAMESPACE" logs "$pod" --tail=40 >&2 || true
                  exit 1
                fi
                printf '%s' "$key"
              }

              IH_KEY=$(extract_api_key "$IH_POD_LABEL")
              IS_KEY=$(extract_api_key "$IS_POD_LABEL")
              echo "[ih-seed] IH super-user key  = ${IH_KEY:0:8}..."
              echo "[ih-seed] IS super-user key  = ${IS_KEY:0:8}..."

              ########################################################
              # Step 1b: pre-flight liveness probe — even after Ready,
              # the SuperUserSeedExtension may need a moment to register
              # the principal. Hammer a benign GET until it returns 200.
              ########################################################
              wait_api() {
                local url="$1" key="$2" name="$3"
                for i in $(seq 1 30); do
                  local code
                  code=$(curl -sS -o /dev/null -w '%{http_code}' \
                    -H "x-api-key: $key" \
                    "$url/v1alpha/participants?limit=1" || echo "000")
                  if [ "$code" = "200" ]; then
                    echo "[ih-seed] $name reachable (HTTP $code)"
                    return 0
                  fi
                  echo "[ih-seed] waiting on $name ... (attempt $i/30, last=$code)"
                  sleep 2
                done
                echo "[ih-seed] FATAL: $name never returned 200" >&2
                return 1
              }
              wait_api "$IH_IDENTITY" "$IH_KEY" "IH identity API"
              wait_api "$IS_IDENTITY" "$IS_KEY" "IS identity API"

              ########################################################
              # POST helper: idempotent, treats 409 as success.
              ########################################################
              post_idem() {
                local url="$1" key="$2" body="$3" ctx="$4"
                local code
                code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
                  -X POST "$url" \
                  -H "Content-Type: application/json" \
                  -H "x-api-key: $key" \
                  -d "$body") || true
                case "$code" in
                  2??) echo "[ih-seed] $ctx  OK ($code)";;
                  409) echo "[ih-seed] $ctx  already exists (409, idempotent)";;
                  *)
                    echo "[ih-seed] $ctx  FAILED ($code) — body:" >&2
                    cat /tmp/resp.json >&2 || true
                    echo >&2
                    return 1
                    ;;
                esac
              }

              ########################################################
              # Build a participant-context create body. The `key` block
              # tells the server to generate a fresh keypair inline using
              # the JsonWebKey2020 / EC P-256 algorithm (matches the
              # default suite used by the rest of the umbrella stack).
              ########################################################
              build_ctx_body() {
                local pid="$1" did="$2" role="$3"
                cat <<JSON
              {
                "active": true,
                "participantId": "$pid",
                "did": "$did",
                "roles": ["$role"],
                "key": {
                  "keyId": "$pid-key-1",
                  "type": "JsonWebKey2020",
                  "privateKeyAlias": "$pid-key-1",
                  "keyGeneratorParams": {
                    "algorithm": "EC",
                    "curve": "secp256r1"
                  }
                }
              }
              JSON
              }

              ########################################################
              # SETUP: bootstrap the IssuerService's own ParticipantContext.
              # This must exist before any holder can be registered (the
              # holder POST takes the issuer ctx id as a path segment).
              ########################################################
              echo ""
              echo "================================================================"
              echo "[ih-seed] SETUP: bootstrap issuer ParticipantContext on IS"
              echo "================================================================"
              ISSUER_BODY=$(build_ctx_body "$ISSUER_PID" "$ISSUER_DID" "ROLE_ADMIN")
              post_idem \
                "$IS_IDENTITY/v1alpha/participants" \
                "$IS_KEY" \
                "$ISSUER_BODY" \
                "(setup) IS issuer participant-context"

              # Activate the issuer (publishes did:web document on the IS host).
              post_idem \
                "$IS_IDENTITY/v1alpha/participants/$ISSUER_PID_B64/state?isActive=true" \
                "$IS_KEY" \
                "" \
                "(setup) IS issuer activate"

              ########################################################
              # PER-PARTICIPANT loop — provision each holder on IH and
              # register it with IS.
              ########################################################
              jq -r 'to_entries[] | @base64' /etc/wallet/participants.json | while read -r row; do
                entry=$(echo "$row" | base64 -d)
                PID=$(echo "$entry" | jq -r '.key')
                BPN=$(echo "$entry" | jq -r '.value.bpn')
                ROLE=$(echo "$entry" | jq -r '.value.role')
                DID=$(echo "$entry" | jq -r '.value.did')
                PART_ID=$(echo "$entry" | jq -r '.value.participantId')
                PART_B64=$(echo "$entry" | jq -r '.value.participantIdB64')

                echo ""
                echo "================================================================"
                echo "[ih-seed] participant=$PID role=$ROLE bpn=$BPN did=$DID"
                echo "================================================================"

                ######################################################
                # (A) Create holder ParticipantContext on IH with
                #     inline keypair generation.
                ######################################################
                IH_BODY=$(build_ctx_body "$PART_ID" "$DID" "ROLE_USER")
                post_idem \
                  "$IH_IDENTITY/v1alpha/participants" \
                  "$IH_KEY" \
                  "$IH_BODY" \
                  "(A) IH holder participant-context"

                ######################################################
                # (B) Activate holder ctx — publishes did:web document
                #     and exposes the verification method to consumers.
                ######################################################
                post_idem \
                  "$IH_IDENTITY/v1alpha/participants/$PART_B64/state?isActive=true" \
                  "$IH_KEY" \
                  "" \
                  "(B) IH holder activate"

                ######################################################
                # (C) Register holder with IssuerService so it can
                #     receive credentials issued by ISSUER_DID.
                ######################################################
                HOLDER_BODY=$(cat <<JSON
              {
                "did": "$DID",
                "holderId": "$PART_ID",
                "name": "$PID ($BPN)"
              }
              JSON
              )
                post_idem \
                  "$IS_ISSUERADMIN/v1alpha/participants/$ISSUER_PID_B64/holders" \
                  "$IS_KEY" \
                  "$HOLDER_BODY" \
                  "(C) IS holder registration"

              done

              ########################################################
              # SUMMARY
              ########################################################
              PCOUNT=$(jq 'length' /etc/wallet/participants.json)
              echo ""
              echo "[ih-seed] ================================================================"
              echo "[ih-seed]  SEED SUMMARY: $PCOUNT participants provisioned successfully"
              echo "[ih-seed]  (issuer=$ISSUER_PID activated, all holders created+activated+registered)"
              echo "[ih-seed]  Note: VerifiableCredential issuance is exercised by data-flow tests,"
              echo "[ih-seed]  not by this seeding hook."
              echo "[ih-seed] ================================================================"
{{- end }}
