{{- /*
   Post-install hook: seed IdentityHub + IssuerService with all participants
   declared in the umbrella chart's `wallet.participants` map.

   Implements the DCP provisioning walkthrough from upstream
   tractusx-identityhub @ v0.2.0:
   https://github.com/eclipse-tractusx/tractusx-identityhub/tree/main/docs/usage/dcp-api-walkthrough

   --------------------------------------------------------------------------
   API surface (v0.2.0, verified against the upstream Bruno collection
   and `docs/usage/dcp-api-walkthrough/0[1-9]_*.md`):

     IdentityHub  POST /api/identity/v1alpha/participants                       (step 2: create holder ctx)
     IdentityHub  POST /api/identity/v1alpha/participants/{ctx}/state?isActive=true   (step 3: activate)
     IdentityHub  POST /api/identity/v1alpha/participants/{ctx}/credentials/request   (step 8: DCP request)
     IdentityHub  GET  /api/identity/v1alpha/participants/{ctx}/credentials           (step 9: retrieve)

     IssuerSvc    POST /api/identity/v1alpha/participants                       (step 1: create issuer ctx —
                                                                                  IS uses the same identity API)
     IssuerSvc    POST /api/identity/v1alpha/participants/{ctx}/state?isActive=true   (step 3: activate)
     IssuerSvc    POST /api/admin/v1alpha/participants/{issuerCtx}/attestations            (step 5)
     IssuerSvc    POST /api/admin/v1alpha/participants/{issuerCtx}/credentialdefinitions   (step 6)
     IssuerSvc    POST /api/admin/v1alpha/participants/{issuerCtx}/holders                 (step 7)

   Auth: every admin call carries `x-api-key: <key>`. The key is generated
         on first boot by SuperUserSeedExtension and printed once to the
         pod log; we extract it via `kubectl logs`.

   NOTE on the issuer-admin path: the chart mounts the issuer-admin
   endpoint at `/api/admin` (NOT `/api/issueradmin` — the latter is only
   the bruno-collection variable name). Confirmed via the upstream
   tractusx-issuerservice chart README.
   --------------------------------------------------------------------------

   Flow:
     0.  Wait for IH/IS pods to be Ready.
     1.  Extract super-user API keys from IH/IS pod logs.
     1b. Pre-flight liveness probe (GET participants?limit=1 → 200).
     2.  SETUP — bootstrap the issuer's own ParticipantContext on IS
         (create + activate), then create one shared `holders` attestation
         + one CredentialDefinition per unique credential type declared
         under wallet.participants[].credentials. Idempotent.
     3.  PER PARTICIPANT (consumers + provider):
           a. Create holder ParticipantContext on IH (with inline keypair
              + CredentialService serviceEndpoint).
           b. Activate holder ctx (publishes did:web).
           c. Register holder with IssuerService.
           d. (best-effort) For each credential type declared for this
              participant: POST credentials/request to IH and poll
              IH /credentials until the credential appears in state ISSUED.
              Failures here are logged as warnings, not Job failures —
              the DCP exchange depends on did:web resolution + STS keying
              that may not be wired correctly on every cluster.
     4.  Emit a final SEED SUMMARY line.

   Idempotency: every POST tolerates HTTP 409 (already-exists).
   Failure semantics: setup + steps 2/3/5/6/7 are strict (any ≥400 fails the
   Job). Steps 8/9 (credentials request + retrieve) remain best-effort and
   only emit warnings — the DCP exchange depends on did:web resolution and
   STS keying that may not be wired correctly on every cluster. The
   `database` attestation in §5 is now reliable because we deploy the
   upstream **postgres** IssuerService image (`tractusx-issuerservice`),
   which bundles the `issuerservice-database-attestations` extension; the
   memory image does not.
*/ -}}
{{- if and (eq (.Values.wallet.mode | default "stub") "identityHub") .Values.wallet.identityHubSeed.enabled }}
{{- $fullName := include "dataprovider.fullname" . -}}
{{- $seed := .Values.wallet.identityHubSeed -}}
{{- $cmName := .Values.wallet.derivedConfigMap | default (printf "%s-wallet-mode" .Release.Name) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-post-install-identityhub-seed
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    tractusx.eclipse.org/wallet-mode: "identityHub"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      name: {{ $fullName }}-ih-seed
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      serviceAccountName: {{ $fullName }}-ih-seed
      restartPolicy: Never
      volumes:
        - name: wallet-data
          configMap:
            name: {{ $cmName }}
      containers:
        - name: ih-seed
          image: {{ $seed.image | quote }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: wallet-data
              mountPath: /etc/wallet
              readOnly: true
          env:
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: IH_POD_LABEL
              value: {{ $seed.identityHubPodLabel | quote }}
            - name: IS_POD_LABEL
              value: {{ $seed.issuerServicePodLabel | quote }}
            - name: READINESS_TIMEOUT
              value: {{ $seed.readinessTimeoutSeconds | quote }}
          command: ["/bin/bash", "-eu", "-o", "pipefail", "-c"]
          args:
            - |
              set -eu -o pipefail

              IH_IDENTITY=$(cat /etc/wallet/identity-hub-internal-identity-api)
              IH_CREDENTIALS=$(cat /etc/wallet/identity-hub-internal-credentials-api)
              IS_IDENTITY=$(cat /etc/wallet/issuer-service-internal-identity-api)
              IS_ISSUERADMIN=$(cat /etc/wallet/issuer-service-internal-issueradmin-api)
              IS_ISSUANCE=$(cat /etc/wallet/issuer-service-internal-issuance-api)
              ISSUER_DID=$(cat /etc/wallet/issuer-did)
              ISSUER_PID=$(cat /etc/wallet/issuer-participant-id)
              ISSUER_PID_B64=$(cat /etc/wallet/issuer-participant-id-b64)

              echo "[ih-seed] identity-hub identity API     = $IH_IDENTITY"
              echo "[ih-seed] identity-hub credentials API  = $IH_CREDENTIALS"
              echo "[ih-seed] issuer-service identity API   = $IS_IDENTITY"
              echo "[ih-seed] issuer-service issueradmin    = $IS_ISSUERADMIN"
              echo "[ih-seed] issuer-service issuance API   = $IS_ISSUANCE"
              echo "[ih-seed] issuer DID                    = $ISSUER_DID"
              echo "[ih-seed] issuer participant id         = $ISSUER_PID"
              echo "[ih-seed] issuer participant id (b64)   = $ISSUER_PID_B64"

              ########################################################
              # Step 0: Wait for IH + IS pods to be Ready.
              ########################################################
              echo "[ih-seed] waiting for IH/IS pods to be Ready (timeout=${READINESS_TIMEOUT}s)"
              kubectl -n "$NAMESPACE" wait --for=condition=Ready pod \
                -l "$IH_POD_LABEL" --timeout="${READINESS_TIMEOUT}s"
              kubectl -n "$NAMESPACE" wait --for=condition=Ready pod \
                -l "$IS_POD_LABEL" --timeout="${READINESS_TIMEOUT}s"

              ########################################################
              # Step 1: extract super-user API keys from pod logs.
              # The SuperUserSeedExtension logs once at startup:
              #   "[SuperUserSeedExtension] Created user 'super-user'.
              #    Please take note of the API Key: <base64>.<token>"
              ########################################################
              extract_api_key() {
                local label="$1"
                local pod
                pod=$(kubectl -n "$NAMESPACE" get pod -l "$label" \
                  -o jsonpath='{.items[0].metadata.name}')
                local key=""
                # Try current logs first.
                key=$(kubectl -n "$NAMESPACE" logs "$pod" --tail=-1 \
                  | grep -oE "Please take note of the API Key:[[:space:]]+[A-Za-z0-9+/=._-]+" \
                  | head -n1 \
                  | sed -E "s/.*:[[:space:]]+//")
                # Postgres-backed IH/IS prints the API key ONLY on first
                # boot; subsequent restarts log "super-user already exists"
                # and the key never reappears. Fall back to --previous so
                # re-seeding after an IH/IS pod restart still works.
                if [ -z "$key" ]; then
                  key=$(kubectl -n "$NAMESPACE" logs "$pod" --previous --tail=-1 2>/dev/null \
                    | grep -oE "Please take note of the API Key:[[:space:]]+[A-Za-z0-9+/=._-]+" \
                    | head -n1 \
                    | sed -E "s/.*:[[:space:]]+//") || true
                fi
                if [ -z "$key" ]; then
                  echo "[ih-seed] FATAL: could not extract super-user API key from pod $pod" >&2
                  echo "[ih-seed] Hint: for postgres-backed IH/IS, the super-user API key" >&2
                  echo "[ih-seed]       is printed once on first boot only. If the pod was" >&2
                  echo "[ih-seed]       restarted and --previous logs have rotated, delete" >&2
                  echo "[ih-seed]       the 'super-user' ParticipantContext row from the DB" >&2
                  echo "[ih-seed]       and restart the pod to re-emit the key." >&2
                  kubectl -n "$NAMESPACE" logs "$pod" --tail=40 >&2 || true
                  exit 1
                fi
                printf '%s' "$key"
              }

              IH_KEY=$(extract_api_key "$IH_POD_LABEL")
              IS_KEY=$(extract_api_key "$IS_POD_LABEL")
              echo "[ih-seed] IH super-user key  = ${IH_KEY:0:8}..."
              echo "[ih-seed] IS super-user key  = ${IS_KEY:0:8}..."

              ########################################################
              # Step 1b: pre-flight liveness probe — even after Ready,
              # the SuperUserSeedExtension may need a moment to register
              # the principal. Hammer a benign GET until it returns 200.
              ########################################################
              wait_api() {
                local url="$1" key="$2" name="$3"
                for i in $(seq 1 30); do
                  local code
                  code=$(curl -sS -o /dev/null -w '%{http_code}' \
                    -H "x-api-key: $key" \
                    "$url/v1alpha/participants?limit=1" || echo "000")
                  if [ "$code" = "200" ]; then
                    echo "[ih-seed] $name reachable (HTTP $code)"
                    return 0
                  fi
                  echo "[ih-seed] waiting on $name ... (attempt $i/30, last=$code)"
                  sleep 2
                done
                echo "[ih-seed] FATAL: $name never returned 200" >&2
                return 1
              }
              wait_api "$IH_IDENTITY" "$IH_KEY" "IH identity API"
              wait_api "$IS_IDENTITY" "$IS_KEY" "IS identity API"

              ########################################################
              # POST helper: idempotent, treats 409 as success.
              ########################################################
              post_idem() {
                local url="$1" key="$2" body="$3" ctx="$4"
                local code
                code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
                  -X POST "$url" \
                  -H "Content-Type: application/json" \
                  -H "x-api-key: $key" \
                  -d "$body") || true
                case "$code" in
                  2??) echo "[ih-seed] $ctx  OK ($code)";;
                  409) echo "[ih-seed] $ctx  already exists (409, idempotent)";;
                  *)
                    echo "[ih-seed] $ctx  FAILED ($code) — body:" >&2
                    cat /tmp/resp.json >&2 || true
                    echo >&2
                    return 1
                    ;;
                esac
              }

              ########################################################
              # POST helper: best-effort, never fails the Job.
              # Used for steps 8/9 where DCP exchange may surface
              # cluster-specific issues (did:web resolution, STS keying)
              # that we want to surface but not block on.
              ########################################################
              post_softfail() {
                local url="$1" key="$2" body="$3" ctx="$4"
                local code
                code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
                  -X POST "$url" \
                  -H "Content-Type: application/json" \
                  -H "x-api-key: $key" \
                  -d "$body") || code="000"
                case "$code" in
                  2??) echo "[ih-seed] $ctx  OK ($code)"; return 0;;
                  409) echo "[ih-seed] $ctx  already exists (409, idempotent)"; return 0;;
                  *)
                    echo "[ih-seed] $ctx  WARN ($code) — body:"
                    cat /tmp/resp.json || true
                    echo
                    return 1
                    ;;
                esac
              }

              ########################################################
              # Build a participant-context create body. Includes a
              # `key` block telling the server to generate a fresh keypair
              # inline (JsonWebKey2020 / EC P-256 — the default suite the
              # rest of the umbrella stack expects), and a `serviceEndpoints`
              # array so the resulting did:web document advertises the
              # right service entry (per upstream walkthrough §02).
              #
              # Args: pid did role srvType srvUrl
              #   srvType: "CredentialService" (holder) | "IssuerService" (issuer)
              #   srvUrl:  the URL the DID document should advertise
              ########################################################
              build_ctx_body() {
                local pid="$1" did="$2" role="$3" srvType="$4" srvUrl="$5"
                cat <<JSON
              {
                "active": true,
                "participantId": "$pid",
                "did": "$did",
                "roles": ["$role"],
                "key": {
                  "keyId": "$did#key-1",
                  "type": "JsonWebKey2020",
                  "privateKeyAlias": "$pid-key-1",
                  "keyGeneratorParams": {
                    "algorithm": "EC",
                    "curve": "secp256r1"
                  }
                },
                "serviceEndpoints": [
                  {
                    "id": "$did#$srvType",
                    "type": "$srvType",
                    "serviceEndpoint": "$srvUrl"
                  }
                ]
              }
              JSON
              }

              ########################################################
              # Per-credential-type metadata: maps the bare type name we
              # store in wallet.participants[].credentials to the
              # credential-definition `id` (used as foreign key by the
              # `credentials/request` body in step 8) and the json-schema
              # URL published by tractusx-profiles.
              # Today all supported types follow the same database-attestation
              # template — this map is the place to extend if we add a
              # type that needs different attestations or rules.
              ########################################################
              cred_def_id_for() {
                # POSIX-portable lowercase + tractusx prefix.
                local t
                t=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
                printf 'tx-%s' "$t"
              }
              cred_schema_for() {
                case "$1" in
                  MembershipCredential)
                    printf 'https://raw.githubusercontent.com/eclipse-tractusx/tractusx-profiles/main/cx/credentials/membership.credential.schema.json' ;;
                  DataExchangeGovernanceCredential)
                    printf 'https://raw.githubusercontent.com/eclipse-tractusx/tractusx-profiles/main/cx/credentials/dataExchangeGovernance.credential.schema.json' ;;
                  FrameworkAgreementCredential)
                    printf 'https://raw.githubusercontent.com/eclipse-tractusx/tractusx-profiles/main/cx/credentials/frameworkAgreement.credential.schema.json' ;;
                  *)
                    printf '' ;;
                esac
              }

              ########################################################
              # SETUP: bootstrap the IssuerService's own ParticipantContext.
              # This must exist before any holder can be registered (the
              # holder POST takes the issuer ctx id as a path segment).
              ########################################################
              echo ""
              echo "================================================================"
              echo "[ih-seed] SETUP: bootstrap issuer ParticipantContext on IS"
              echo "================================================================"
              # Issuer's IssuerService endpoint published in its own DID document.
              ISSUER_SRV_URL="$IS_ISSUANCE/v1alpha/participants/$ISSUER_PID_B64"
              ISSUER_BODY=$(build_ctx_body \
                "$ISSUER_PID" "$ISSUER_DID" "ROLE_ADMIN" \
                "IssuerService" "$ISSUER_SRV_URL")
              post_idem \
                "$IS_IDENTITY/v1alpha/participants" \
                "$IS_KEY" \
                "$ISSUER_BODY" \
                "(setup) IS issuer participant-context"

              # Activate the issuer (publishes did:web document on the IS host).
              post_idem \
                "$IS_IDENTITY/v1alpha/participants/$ISSUER_PID_B64/state?isActive=true" \
                "$IS_KEY" \
                "" \
                "(setup) IS issuer activate"

              ########################################################
              # SETUP step 5: create one shared `holders` attestation.
              # Per upstream walkthrough §05 the IssuerService ships a
              # `database` attestation that reads the `holders` table
              # populated by step 7. One attestation is sufficient for
              # all credential types because the `mappings` block on
              # each CredentialDefinition decides which columns flow
              # into the credentialSubject.
              ########################################################
              ATTESTATION_ID="holders-database-attestation"
              ATTESTATION_BODY=$(cat <<JSON
              {
                "id": "$ATTESTATION_ID",
                "attestationType": "database",
                "configuration": {
                  "dataSourceName": "holder",
                  "tableName": "holders"
                }
              }
              JSON
              )
              # Strict: the postgres IssuerService image (tractusx-issuerservice,
              # NOT -memory) bundles the upstream `issuerservice-database-
              # attestations` extension that registers the `database` factory.
              # The chart's auto-generated `issuerservice-datasource-config`
              # ConfigMap wires the `holder` subsystem to the bundled postgres,
              # and Flyway migrations create the `holders` table on first boot.
              # If this POST fails, something is wrong with the image or DB
              # bootstrap — fail the Job rather than mask it.
              post_idem \
                "$IS_ISSUERADMIN/v1alpha/participants/$ISSUER_PID_B64/attestations" \
                "$IS_KEY" \
                "$ATTESTATION_BODY" \
                "(setup §5) IS attestation"

              ########################################################
              # SETUP step 6: create one CredentialDefinition per unique
              # credential type declared anywhere under
              # wallet.participants[].credentials. The set is computed
              # in /etc/wallet/credential-types.json (see configmap).
              # Each definition references the shared attestation above
              # and maps the holders table columns (`did`, `holder_id`)
              # onto the credential subject.
              ########################################################
              jq -r '.[]' /etc/wallet/credential-types.json | while read -r CRED_TYPE; do
                [ -z "$CRED_TYPE" ] && continue
                CRED_ID=$(cred_def_id_for "$CRED_TYPE")
                CRED_SCHEMA=$(cred_schema_for "$CRED_TYPE")
                CRED_DEF_BODY=$(cat <<JSON
              {
                "id": "$CRED_ID",
                "credentialType": "$CRED_TYPE",
                "format": "VC1_0_JWT",
                "attestations": ["$ATTESTATION_ID"],
                "jsonSchema": "{}",
                "jsonSchemaUrl": "$CRED_SCHEMA",
                "mappings": [
                  { "input": "did",       "output": "credentialSubject.id",               "required": true },
                  { "input": "holder_id", "output": "credentialSubject.holderIdentifier", "required": true }
                ],
                "validity": 31536000
              }
              JSON
              )
                # Strict: depends on §5 attestation, which is now strict.
                post_idem \
                  "$IS_ISSUERADMIN/v1alpha/participants/$ISSUER_PID_B64/credentialdefinitions" \
                  "$IS_KEY" \
                  "$CRED_DEF_BODY" \
                  "(setup §6) IS credentialdefinition $CRED_TYPE → $CRED_ID"
              done

              ########################################################
              # PER-PARTICIPANT loop — provision each holder on IH and
              # register it with IS.
              ########################################################
              # Track best-effort issuance outcomes for the SUMMARY line.
              ISSUANCE_OK=0
              ISSUANCE_WARN=0

              jq -r 'to_entries[] | @base64' /etc/wallet/participants.json | while read -r row; do
                entry=$(echo "$row" | base64 -d)
                PID=$(echo "$entry" | jq -r '.key')
                BPN=$(echo "$entry" | jq -r '.value.bpn')
                ROLE=$(echo "$entry" | jq -r '.value.role')
                DID=$(echo "$entry" | jq -r '.value.did')
                PART_ID=$(echo "$entry" | jq -r '.value.participantId')
                PART_B64=$(echo "$entry" | jq -r '.value.participantIdB64')
                VAULT_URL=$(echo "$entry" | jq -r '.value.vaultUrl // ""')
                VAULT_TOKEN=$(echo "$entry" | jq -r '.value.vaultToken // ""')

                echo ""
                echo "================================================================"
                echo "[ih-seed] participant=$PID role=$ROLE bpn=$BPN did=$DID"
                echo "================================================================"

                ######################################################
                # (A) Create holder ParticipantContext on IH with
                #     inline keypair generation + CredentialService
                #     serviceEndpoint (per walkthrough §02).
                ######################################################
                HOLDER_CS_URL="$IH_CREDENTIALS/v1/participants/$PART_B64"
                IH_BODY=$(build_ctx_body \
                  "$PART_ID" "$DID" "ROLE_USER" \
                  "CredentialService" "$HOLDER_CS_URL")
                post_idem \
                  "$IH_IDENTITY/v1alpha/participants" \
                  "$IH_KEY" \
                  "$IH_BODY" \
                  "(A) IH holder participant-context"

                ######################################################
                # (A') D23b: propagate auto-generated STS client_secret
                # to the connector's Vault.
                #
                # On 201, IdentityHub returns a CreateParticipantContextResponse
                # with {apiKey, clientId, clientSecret}; clientSecret is a
                # random 16-char string generated by StsAccountProvisionerImpl
                # and is returned ONLY on this first create call. We write
                # it into the connector's HashiCorp Vault at the alias the
                # connector reads via EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS
                # (`edc-wallet-secret`), so RemoteSecureTokenService can
                # authenticate against IH's /api/sts/token endpoint.
                #
                # On 409 (participant already exists), IH does NOT return
                # the secret — it cannot be recovered. We log a WARN; a
                # clean reinstall (which wipes IH's postgres) is required
                # to rotate.
                ######################################################
                if [ -n "$VAULT_URL" ] && [ -s /tmp/resp.json ]; then
                  CS=$(jq -r '.clientSecret // empty' /tmp/resp.json 2>/dev/null || true)
                  if [ -n "$CS" ]; then
                    VCODE=$(curl -sS -o /tmp/vault-resp.json -w '%{http_code}' \
                      -X POST "$VAULT_URL/v1/secret/data/edc-wallet-secret" \
                      -H "X-Vault-Token: $VAULT_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"data\":{\"content\":\"$CS\"}}" || echo "000")
                    case "$VCODE" in
                      2??) echo "[ih-seed] (A') vault write edc-wallet-secret @ $VAULT_URL  OK ($VCODE)";;
                      *)   echo "[ih-seed] (A') vault write FAILED ($VCODE) — body:" >&2
                           cat /tmp/vault-resp.json >&2 || true
                           echo >&2
                           return 1 2>/dev/null || exit 1
                           ;;
                    esac
                  else
                    echo "[ih-seed] (A') WARN: IH did not return clientSecret (likely 409 existing ctx); vault NOT updated."
                    echo "[ih-seed] (A')       Full reinstall required to rotate client_secret for $PID."
                  fi
                fi
                ######################################################
                # (B) Activate holder ctx — publishes did:web document
                #     and exposes the verification method to consumers.
                ######################################################
                post_idem \
                  "$IH_IDENTITY/v1alpha/participants/$PART_B64/state?isActive=true" \
                  "$IH_KEY" \
                  "" \
                  "(B) IH holder activate"

                ######################################################
                # (C) Register holder with IssuerService so it can
                #     receive credentials issued by ISSUER_DID.
                ######################################################
                HOLDER_BODY=$(cat <<JSON
              {
                "did": "$DID",
                "holderId": "$BPN",
                "name": "$PID ($BPN)"
              }
              JSON
              )
                post_idem \
                  "$IS_ISSUERADMIN/v1alpha/participants/$ISSUER_PID_B64/holders" \
                  "$IS_KEY" \
                  "$HOLDER_BODY" \
                  "(C) IS holder registration"

                ######################################################
                # (D) Best-effort: trigger DCP issuance for each
                #     credential declared on this participant
                #     (walkthrough §08), then poll the holder's
                #     credential store (§09) until the credential
                #     turns up in state ISSUED.
                #
                #     Failures here do NOT fail the Job — DCP
                #     issuance involves did:web resolution + STS keying
                #     that is cluster-environment-sensitive.
                ######################################################
                CRED_LIST=$(echo "$entry" | jq -c '.value.credentials // []')
                if [ "$(echo "$CRED_LIST" | jq 'length')" = "0" ]; then
                  echo "[ih-seed] (D) no credentials declared for $PID — skipping issuance"
                  continue
                fi

                echo "$CRED_LIST" | jq -r '.[]' | while read -r CRED_TYPE; do
                  [ -z "$CRED_TYPE" ] && continue
                  CRED_ID=$(cred_def_id_for "$CRED_TYPE")
                  REQ_BODY=$(cat <<JSON
              {
                "issuerDid": "$ISSUER_DID",
                "holderPid": "$ISSUER_DID",
                "credentials": [
                  { "id": "$CRED_ID", "type": "$CRED_TYPE", "format": "VC1_0_JWT" }
                ]
              }
              JSON
              )
                  if post_softfail \
                       "$IH_IDENTITY/v1alpha/participants/$PART_B64/credentials/request" \
                       "$IH_KEY" \
                       "$REQ_BODY" \
                       "(D §8) IH request $CRED_TYPE for $PID"; then
                    # Poll IH for the credential to appear in state ISSUED.
                    ok=0
                    for j in $(seq 1 20); do
                      body=$(curl -sS \
                        -H "x-api-key: $IH_KEY" \
                        "$IH_IDENTITY/v1alpha/participants/$PART_B64/credentials" || echo '[]')
                      if echo "$body" | jq -e --arg t "$CRED_TYPE" \
                           '.[] | select(.type == $t and .state == "ISSUED")' \
                           >/dev/null 2>&1; then
                        echo "[ih-seed] (D §9) $CRED_TYPE ISSUED for $PID (attempt $j)"
                        ok=1
                        break
                      fi
                      sleep 2
                    done
                    if [ "$ok" = "0" ]; then
                      echo "[ih-seed] (D §9) WARN: $CRED_TYPE never reached ISSUED for $PID after 40s"
                    fi
                  fi
                done

              done

              ########################################################
              # SUMMARY
              ########################################################
              PCOUNT=$(jq 'length' /etc/wallet/participants.json)
              CTYPES=$(jq -r '. | join(",")' /etc/wallet/credential-types.json)
              echo ""
              echo "[ih-seed] ================================================================"
              echo "[ih-seed]  SEED SUMMARY: $PCOUNT participants provisioned successfully"
              echo "[ih-seed]  (issuer=$ISSUER_PID activated, all holders created+activated+registered)"
              echo "[ih-seed]  credentialDefinitions configured: $CTYPES"
              echo "[ih-seed]  Credential issuance (§8/§9) is best-effort; check WARN lines"
              echo "[ih-seed]  above to assess DCP exchange readiness on this cluster."
              echo "[ih-seed] ================================================================"
{{- end }}
