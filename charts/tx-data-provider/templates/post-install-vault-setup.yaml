---
{{ if index .Values  "dataspace-connector-bundle" "vault" "enabled" }}
{{- $vaultToken := index .Values  "dataspace-connector-bundle" "tractusx-connector" "vault" "hashicorp" "token" -}}
{{- $vaultUrl := tpl (index .Values  "dataspace-connector-bundle" "tractusx-connector" "vault" "hashicorp" "url") . -}}
{{- $fullName := include "dataprovider.fullname" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-post-install-vault-setup
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: "{{ .Release.Name }}"
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-job
          image: {{ .Values.vaultSetup.image | quote }}
          imagePullPolicy: "IfNotPresent"
          command:
            - "/bin/sh"
            - "-c"
            - |
              sleep 10
              {{- range $key, $value := .Values.secrets }}
              {{- /*
                   identityHub mode: `edc-wallet-secret` is OWNED by the IdentityHub
                   seed Job (post-install-identityhub-seed.yaml, block A'), which writes
                   the REAL random STS clientSecret returned by IdentityHub on the
                   ParticipantContext-create 201. This hook re-fires on post-upgrade
                   (the documented re-seed runbook), and re-writing the placeholder here
                   would clobber that real secret; the seed then gets HTTP 409 and cannot
                   recover it, leaving Vault with the placeholder -> STS 401 invalid_client
                   -> catalog 502. So skip this one alias in identityHub mode and let the
                   seed own it. In stub mode `changeme` IS the secret the stub accepts, so
                   the write must still happen there. `$` = root ctx (`.` is the map value
                   inside range).
              */ -}}
              {{- if not (and (eq ($.Values.wallet.mode | default "stub") "identityHub") (eq $key "edc-wallet-secret")) }}
              wget --header 'Content-Type: application/json' --header 'X-Vault-Token: {{ $vaultToken }}' \
              --post-data '{"data": {"content": "{{ $value }}"}}' "{{ $vaultUrl }}/v1/secret/data/{{ $key }}"
              {{- end }}
              {{- end }}

              wget --header 'Content-Type: application/json' --header 'X-Vault-Token: {{ $vaultToken }}' \
              --post-file=/opt/config/cert.json "{{ $vaultUrl }}/v1/secret/data/tokenSignerPublicKey"

              wget --header 'Content-Type: application/json' --header 'X-Vault-Token: {{ $vaultToken }}' \
              --post-file=/opt/config/key.json "{{ $vaultUrl }}/v1/secret/data/tokenSignerPrivateKey"

              wget --header 'Content-Type: application/json' --header 'X-Vault-Token: {{ $vaultToken }}' \
              --post-file=/opt/config/aes-secret.json "{{ $vaultUrl }}/v1/secret/data/tokenEncryptionAesKey"
              {{- if eq (.Values.wallet.mode | default "stub") "identityHub" }}

              # -----------------------------------------------------------------
              # Identity Hub wallet mode — write canonical Vault aliases.
              #
              # Memory variant (tractusx-identityhub-memory v0.2.0) bootstraps
              # its initial participant from chart-level config, so these
              # writes are a no-op for the umbrella test profile. They are
              # included as the canonical pattern to use when swapping in the
              # non-memory `tractusx-identityhub` chart, which DOES read keys
              # from an external Vault (reconfigure the IH chart to point at
              # `{{ $vaultUrl }}` with token `{{ $vaultToken }}` at that time).
              #
              # Aliases written here match the defaults in
              # charts/identity-and-trust-bundle/values.yaml :: identity-hub.
              # -----------------------------------------------------------------
              wget --header 'Content-Type: application/json' --header 'X-Vault-Token: {{ $vaultToken }}' \
              --post-data '{"data":{"content":"sup3r$3cr3t"}}' "{{ $vaultUrl }}/v1/secret/data/identityhub-api-key"
              wget --header 'Content-Type: application/json' --header 'X-Vault-Token: {{ $vaultToken }}' \
              --post-data '{"data":{"content":"operator-sts-secret"}}' "{{ $vaultUrl }}/v1/secret/data/operator-sts-secret-alias"
              {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /opt/config
      volumes:
        - name: config-volume
          configMap:
            name: {{ $fullName }}-vault-edc-configmap
            defaultMode: 0777
{{ end }}
