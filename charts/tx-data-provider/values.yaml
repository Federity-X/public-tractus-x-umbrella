configuration:
  postgresuser: &postgresuser testuser
  postgrespass: &postgrespass testpass
  edcKey: &edcKey TEST

nameOverride: ""
fullnameOverride: ""
seedTestdata: false  # Toggle seeding of testdata. Can be enabled when the edc should be seeded with testdata on startup.
testData:
  image: python:3.11
testdataConfigMap: ""  # Provide a custom configmap for post-install-job-upload-testdata.yaml.
backendUrl: ""  # Override the backend service url
registryUrl: ""  # Override the digital twin registry url
controlplanePublicUrl: ""  # Override the edc controlplane protocol url
controlplaneManagementUrl: ""  # Override the edc controlplane management url
dataplaneUrl: ""  # Override the edc dataplane public url
vaultSetup:
  image: alpine:3.19
# Wallet implementation selection, mirrored from the umbrella `wallet` block
# so that templates under charts/tx-data-provider/templates can branch on
# `.Values.wallet.mode`. Keep in sync with charts/umbrella/values.yaml.
wallet:
  mode: stub
  # Name of the ConfigMap (rendered by the umbrella chart) that carries
  # derived wallet data (participants.json, endpoint URLs, issuer DID).
  # Only consumed when wallet.mode=identityHub.
  derivedConfigMap: ""
  # IdentityHub seeding hook — implements the 10-step DCP walkthrough
  # (https://github.com/eclipse-tractusx/tractusx-identityhub/tree/main/docs/usage/dcp-api-walkthrough)
  # against the deployed IdentityHub + IssuerService for every participant
  # declared in wallet.participants. Idempotent.
  identityHubSeed:
    enabled: true
    image: alpine/k8s:1.31.3
    # Label selectors used to locate IH / IS pods to read the super-user
    # API key from stdout logs. Must match the pod labels rendered by the
    # upstream IH / IS charts (app.kubernetes.io/name = `identity-hub`
    # / `issuer-service`, regardless of the `-memory` chart variant).
    identityHubPodLabel: "app.kubernetes.io/name=identity-hub"
    issuerServicePodLabel: "app.kubernetes.io/name=issuer-service"
    # Maximum seconds to wait for IH/IS pods to become Ready before seeding.
    readinessTimeoutSeconds: 300
    # Maximum seconds to poll for EACH credential to reach state ISSUED after
    # the DCP issuance request. The postgres IssuerService issues noticeably
    # slower than the in-memory variant, so keep this generous.
    credentialPollTimeoutSeconds: 120
    # When true, the seed Job exits non-zero if ANY declared credential did not
    # reach ISSUED. Default false keeps issuance best-effort (a cluster-specific
    # DCP wiring problem is surfaced loudly in the SEED SUMMARY but does not
    # block the install). Set true in CI / gated installs that must guarantee
    # full issuance.
    strictIssuance: false
secrets:
  edc-wallet-secret: changeme

dataspace-connector-bundle:
  tractusx-connector:
    enabled: true
    postgresql:
      jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-connector-postgresql:5432/edc"
  postgresql:
    nameOverride: connector-postgresql

digital-twin-bundle:
  digital-twin-registry:
    enabled: true
    registry:
      authentication: false
      dataSource:
        # digital-twin-bundle.digital-twin-registry.registry.dataSource.url
        # No templating possible, need to hardcode string, or set it via property e.g.,
        # helm install <release-name> charts/tx-data-provider --set digital-twin-bundle.digital-twin-registry.registry.dataSource.url=jdbc:postgresql://<release-name>-dtr-postgresql:5432/dtr
        url: "jdbc:postgresql://dtr-postgresql:5432/dtr"
  postgresql:
    fullnameOverride: "dtr-postgresql"

data-persistence-layer-bundle:
  simple-data-backend:
    enabled: true
