#
# LOCAL-TESTING OVERLAY — pins the (currently UNRELEASED) EDC-0.17.0-aligned
# images needed for the full DCP data-transfer flow, on top of the shared
# Identity Hub profile. The full catalog -> negotiation -> transfer -> fetch
# flow is validated on this stack; the released charts still pin the 0.16.0
# line (connector 0.13.0-rc2, IH/IS v0.3.2), which cannot complete the transfer
# (EDC 0.17.0 / IH #937 changed participantContextId URL handling to plain).
#
# DELETE this overlay once tractusx-edc 0.13.0 (EDC 0.17.0) and
# IdentityHub/IssuerService 0.17.0 are released and pinned in the bundle
# Chart.yaml files.
#
# The four images below must be pre-loaded into the local (kind/minikube)
# cluster — they are not on a public registry:
#   docker-identityhub-memory:latest   — tractusx-identityhub PR #308 build (0.17.0)
#   docker-issuerservice:latest        — tractusx-issuerservice PR #308 build (0.17.0, postgres variant)
#   tractusx/edc-controlplane-postgresql-hashicorp-vault:0.13.0-SNAPSHOT — EDC 0.17.0
#   tractusx/edc-dataplane-hashicorp-vault:0.13.0-SNAPSHOT               — EDC 0.17.0
# e.g.:  kind load docker-image docker-identityhub-memory:latest --name <cluster>
#
# Usage:
#   helm install umbrella charts/umbrella \
#     -f charts/values-test-data-exchange-identity-hub.yaml \
#     -f charts/values-test-data-exchange-identity-hub-local-0.17.0.yaml \
#     --namespace umbrella --create-namespace --timeout 20m
###############################################################

# --- IdentityHub + IssuerService: user's local 0.17.0 builds ---
identity-and-trust-bundle:
  identity-hub:
    identityhub:
      image:
        repository: docker-identityhub-memory
        tag: latest
        pullPolicy: Never
  # postgres IH variant (only enabled in the -postgres profile; harmless no-op
  # in the others). Uses the NON-memory 0.17.0 build (docker-identityhub:latest).
  identity-hub-postgres:
    identityhub:
      image:
        repository: docker-identityhub
        tag: latest
        pullPolicy: Never
  issuer-service:
    issuerservice:
      image:
        repository: docker-issuerservice
        tag: latest
        pullPolicy: Never

# --- Per-participant IdentityHubs (only enabled in the -per-participant profile;
#     these keys are harmless no-ops in the shared profile where the deps are off) ---
identity-hub-provider:
  identityhub:
    image:
      repository: docker-identityhub-memory
      tag: latest
      pullPolicy: Never
identity-hub-consumer1:
  identityhub:
    image:
      repository: docker-identityhub-memory
      tag: latest
      pullPolicy: Never
identity-hub-consumer2:
  identityhub:
    image:
      repository: docker-identityhub-memory
      tag: latest
      pullPolicy: Never

# --- Connector control/data planes: EDC 0.17.0 snapshot images ---
tx-data-provider:
  dataspace-connector-bundle:
    tractusx-connector:
      controlplane:
        image:
          repository: tractusx/edc-controlplane-postgresql-hashicorp-vault
          tag: 0.13.0-SNAPSHOT
          pullPolicy: Never
      dataplane:
        image:
          repository: tractusx/edc-dataplane-hashicorp-vault
          tag: 0.13.0-SNAPSHOT
          pullPolicy: Never

dataconsumerOne:
  dataspace-connector-bundle:
    tractusx-connector:
