#
# IN-FLIGHT IMAGE OVERLAY — pins the EDC-0.17.0-aligned images that power the
# #1609 DCP data-transfer DEMONSTRATION, on top of any Identity Hub profile.
# These are the in-flight upstream builds the umbrella PR deliberately rides to
# PROVE the fix now (rather than wait for releases): the full catalog ->
# negotiation -> transfer -> fetch flow is validated on this stack. The released
# charts still pin the 0.16.0 line (connector 0.13.0-rc2, IH/IS v0.3.2), which
# cannot complete the transfer (EDC 0.17.0 / IH #937 changed participantContextId
# URL handling to plain) — a render guard (templates/_wallet-validate.tpl) fails
# any identityHub install that omits this overlay, so the non-working stack is
# never run silently.
#
# Path to merge / removal: ship tractusx-edc 0.13.0 (EDC 0.17.0) -> merge
# IdentityHub/IssuerService 0.17.0 (PR #309) -> bump the bundle Chart.yaml pins
# to the released versions -> DELETE this overlay (and the guard sentinel below).
#
# The five images below are built from source (not on a public registry) and
# must be pre-loaded into the local (kind/minikube) cluster. Build steps:
# docs/user/common/guides/data-exchange-identity-hub.md#build-the-in-flight-images-from-source.
# Their provenance:
#   docker-identityhub-memory:latest   — tractusx-identityhub PR #309 (EDC 0.17.0 upgrade)
#                                         https://github.com/eclipse-tractusx/tractusx-identityhub/pull/309
#   docker-identityhub:latest          — same PR #309, postgres IdentityHub variant
#   docker-issuerservice:latest        — same PR #309, IssuerService (postgres variant)
#   tractusx/edc-controlplane-postgresql-hashicorp-vault:0.13.0-SNAPSHOT — built from
#                                         tractusx-edc `main` (EDC 0.17.0): https://github.com/eclipse-tractusx/tractusx-edc
#   tractusx/edc-dataplane-hashicorp-vault:0.13.0-SNAPSHOT               — built from tractusx-edc `main` (EDC 0.17.0)
# e.g.:  kind load docker-image docker-identityhub-memory:latest --name <cluster>
#
# Usage:
#   helm install umbrella charts/umbrella \
#     -f charts/values-test-data-exchange-identity-hub.yaml \
#     -f charts/values-test-data-exchange-identity-hub-local-0.17.0.yaml \
#     --namespace umbrella --create-namespace --timeout 20m
###############################################################

# --- Version-mismatch guard sentinel ---
# Asserts (to templates/_wallet-validate.tpl) that this overlay — the only
# stack that can complete the DCP transfer — is layered. Without it any
# wallet.mode=identityHub render fails fast rather than silently running the
# non-working released 0.16.0 images. Removed with the overlay post-release.
wallet:
  identityHub:
    imagesOverridden: true

# --- IdentityHub + IssuerService: user's local 0.17.0 builds ---
identity-and-trust-bundle:
  identity-hub:
    identityhub:
      image:
        repository: docker-identityhub-memory
        tag: latest
        pullPolicy: Never
  # postgres IH variant (only enabled in the -postgres profile; harmless no-op
  # in the others). Uses the NON-memory 0.17.0 build (docker-identityhub:latest).
  identity-hub-postgres:
    identityhub:
      image:
        repository: docker-identityhub
        tag: latest
        pullPolicy: Never
  issuer-service:
    issuerservice:
      image:
        repository: docker-issuerservice
        tag: latest
        pullPolicy: Never

# --- Per-participant IdentityHubs (only enabled in the -per-participant profile;
#     these keys are harmless no-ops in the shared profile where the deps are off) ---
identity-hub-provider:
  identityhub:
    image:
      repository: docker-identityhub-memory
      tag: latest
      pullPolicy: Never
identity-hub-consumer1:
  identityhub:
    image:
      repository: docker-identityhub-memory
      tag: latest
      pullPolicy: Never
identity-hub-consumer2:
  identityhub:
    image:
      repository: docker-identityhub-memory
      tag: latest
      pullPolicy: Never

# --- Connector control/data planes: EDC 0.17.0 snapshot images ---
tx-data-provider:
