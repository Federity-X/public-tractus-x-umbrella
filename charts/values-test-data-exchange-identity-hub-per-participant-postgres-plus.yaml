#
# PER-PARTICIPANT-POSTGRES "plus" overlay — the postgres counterpart of
# values-test-data-exchange-identity-hub-per-participant-plus.yaml. Layer it ON TOP
# OF the per-participant-POSTGRES base profile so the fx-connector-ui admin panel
# has everything it needs against the DURABLE IdentityHubs. Identical intent to the
# in-memory plus overlay; the ONLY difference is the consumer1 IdentityHub admin
# ingress targets the postgres dependency alias (`identity-hub-consumer1-postgres`)
# instead of the in-memory `identity-hub-consumer1` (which the postgres base profile
# disables — targeting it would be a silent no-op).
#
#   * consumer1 IdentityHub ADMIN ingress (ih-consumer1-admin.tx.test) — makes the
#     panel's Wallet page work for consumer1, symmetric with the provider admin
#     ingress in the base profile. NO new pod (same IH JVM).
#   * CentralIDP (Keycloak) — OIDC IdP for the panel's optional Keycloak login
#     (verbatim from the in-memory plus overlay; orthogonal to wallet.mode).
#
# Usage (durable stack — four -f files, this one last, + the persistence overlay):
#   bash hack/helm-dependencies.bash
#   helm install umbrella charts/umbrella \
#     -f charts/values-test-data-exchange-identity-hub-per-participant-postgres.yaml \
#     -f charts/values-test-data-exchange-identity-hub-local-0.17.0.yaml \
#     -f charts/values-test-data-exchange-identity-hub-per-participant-postgres-plus.yaml \
#     -f charts/values-persistent-local.yaml \
#     --set centralidp.realmSeeding.initContainer.image.name=umbrella-init-container:be241 \
#     --namespace umbrella --create-namespace --timeout 25m
#
# See the in-memory plus overlay for the CentralIDP caveats + resource-footprint
# notes (they apply unchanged).
###############################################################

# -----------------------------------------------------------------------------
# consumer1 POSTGRES IdentityHub — ADD an admin ingress alongside its public one.
# Helm REPLACES lists, so re-declare the FULL `ingresses` list (base public ingress
# credentials/did/sts PLUS the new admin ingress identity/accounts). All other
# identity-hub-consumer1-postgres keys are map-merged from the base profile.
# -----------------------------------------------------------------------------
identity-hub-consumer1-postgres:
  identityhub:
    ingresses:
      - enabled: true
        hostname: "ih-consumer1.tx.test"
        endpoints: [credentials, did, sts]
        className: "nginx"
        tls:
          enabled: false
      - enabled: true
        hostname: "ih-consumer1-admin.tx.test"
        endpoints: [identity, accounts]
        className: "nginx"
        tls:
          enabled: false

# -----------------------------------------------------------------------------
# CentralIDP (Keycloak) — OIDC IdP for the panel's optional Keycloak login.
# Verbatim from the in-memory plus overlay (orthogonal to the wallet abstraction).
# See that file for the realm-seeding caveats to validate on first bring-up.
# -----------------------------------------------------------------------------
centralidp:
  enabled: true
  keycloak:
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 1536Mi
  realmSeeding:
    sslRequired: "none"
