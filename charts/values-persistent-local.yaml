#
# PROD-ALIKE DURABILITY (part 7a) — Postgres persistence overlay.
#
# Layer as an extra `-f` on any identityHub profile to give the connector +
# CentralIDP Postgres instances a PVC, so their DBs survive pod restarts /
# evictions instead of being wiped (the default is `persistence: false`).
# (IssuerService Postgres is already PVC-backed by the identity-and-trust-bundle.)
#
# MEASURED: persistence adds ~0 RAM (it swaps emptyDir → PVC; same process) — the
# per-participant-plus stack was 6.41 GiB working set with this overlay, fitting a
# 12 GiB Docker VM. VERIFIED: killing a connector Postgres pod recreates it against
# the same PVC and its assets survive.
#
# ⚠ NOT SUFFICIENT ALONE for full Docker/VM-restart durability. The connector +
# IdentityHub STS secrets (e.g. `edc-wallet-secret`) live in the bundle's Vault,
# which runs `server -dev` (in-memory). A Vault restart wipes them and DCP breaks
# (`Failed to fetch client secret from the vault with alias: edc-wallet-secret`,
# then IH STS `401 invalid_client`) — proven live. Full durability additionally
# needs Vault in prod/persistent mode + an init/unseal step (part 7b) — see
# fx-connector-ui docs/HANDOFF-BE-241.md §7.
###############################################################

# Connector DBs (dataspace-connector-bundle) — provider + consumer1.
#
# BUGFIX: the connector control-plane ships a tight liveness probe (initialDelay 30
# + 6×10 ≈ 90s). Under the heavier per-participant-POSTGRES build (two extra IH
# Postgres pods) the startup stampede delays the control-plane's boot past that
# budget, so the kubelet SIGTERM-kills it mid-boot (exitCode 143, observed at ~89s)
# — and it can come back in a half-initialised state (readiness endpoint 404s), which
# then blocks the data-plane self-registration and the post-install test-data hook,
# failing the whole install. There is no startupProbe, so widen the liveness/readiness
# budget (~90 + 20×15 ≈ 390s) so a contended boot completes before the probe fires.
# (Same rationale + pattern as the issuer-service and BDRS probe widenings below;
# harmless on a fast/uncontended node.)
tx-data-provider:
  dataspace-connector-bundle:
    tractusx-connector:
      controlplane:
        livenessProbe:
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 20
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 20
    postgresql:
      primary:
        persistence:
          enabled: true
          size: 5Gi
dataconsumerOne:
  dataspace-connector-bundle:
    tractusx-connector:
      controlplane:
        livenessProbe:
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 20
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 20
    postgresql:
      primary:
        persistence:
          enabled: true
          size: 5Gi

# CentralIDP (Keycloak) Postgres.
centralidp:
  keycloak:
    postgresql:
      primary:
        persistence:
          enabled: true
          size: 2Gi

# BUGFIX: enabling persistence adds a PVC-attach delay that lengthens the
# issuer-service startup. Its default liveness probe (initialDelay 90s + 6×15s ≈
# 180s) is too tight for that on a contended node — the kubelet SIGTERM-killed it
# ~7× (exitCode 143), and it was flapping Ready↔NotReady during the IdentityHub
# seed's credential-request loop, so only 1 of 4 credentials got issued. The
# issuerservice chart has no startupProbe, so widen the liveness/readiness budget
# (~120 + 40×15 ≈ 720s) so it isn't killed mid-startup and stays Ready while the
# seed runs. (Applies whenever persistence is on; harmless when it isn't.)
identity-and-trust-bundle:
  issuer-service:
    issuerservice:
      livenessProbe:
        initialDelaySeconds: 120
        periodSeconds: 15
        failureThreshold: 40
      readinessProbe:
        initialDelaySeconds: 120
        periodSeconds: 15
        failureThreshold: 40

# BUGFIX: the in-memory BDRS ships a very tight liveness probe (initialDelay 5 +
# 6×5 ≈ 35s). Under the persistent build's added node contention it gets
# SIGTERM-killed mid-startup and crash-loops (17 restarts observed); each restart
# wipes its in-memory BPN→DID directory, so the connector's ContractNegotiation-
# Finalized BPN resolve fails ("No BPN entry found for agreement") and transfers
# TERMINATE. Widen its probes so it stays up and the directory (re-seeded by the
# post-install-bdrs-setup hook) survives. (A BDRS restart still loses the directory
# — the documented in-memory-BDRS limitation; keeping it up is the fix here.)
bdrs-server-memory:
  server:
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      failureThreshold: 30
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 30
